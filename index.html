<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>濟州島行程資料登記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 拆分 API Key 避免 GitHub Secret Scanner 觸發誤報
    const k1 = "AIzaSyChnQOp6dz";
    const k2 = "bohJRCPiOMnA65xVmmUyysV8";

    const firebaseConfig = {
      apiKey: k1 + k2,
      authDomain: "jeju-system.firebaseapp.com",
      databaseURL: "https://jeju-system-default-rtdb.firebaseio.com",
      projectId: "jeju-system",
      storageBucket: "jeju-system.firebasestorage.app",
      messagingSenderId: "918975222741",
      appId: "1:918975222741:web:e9434a6326f522904c635c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const form = document.getElementById("guestForm");
    const formContainer = document.getElementById("formContainer");
    const successContainer = document.getElementById("successContainer");
    const submitBtn = document.getElementById("submitBtn");
    
    const nameInput = document.getElementById("name");
    const englishNameInput = document.getElementById("englishName");
    const passportInput = document.getElementById("passport");
    const nationalIdInput = document.getElementById("nationalId");
    const birthdayInput = document.getElementById("birthday");
    const genderSelect = document.getElementById("gender");
    const passportError = document.getElementById("passportError");
    
    const lineNicknameInput = document.getElementById("lineNickname");
    const airlineInput = document.getElementById("airline");
    const arrivalInput = document.getElementById("arrival");
    const departureInput = document.getElementById("departure");
    const arrivalError = document.getElementById("arrivalError");
    const departureError = document.getElementById("departureError");
    const passportFileInput = document.getElementById("passportFile");
    const ocrStatus = document.getElementById("ocrStatus");

    // 1. 初始化 MRZ Worker（僅載入英數白名單）
    let worker = null;
    async function getWorker() {
      if (!worker) {
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<',
          tessedit_pageseg_mode: '6'
        });
      }
      return worker;
    }
    getWorker();

    // 2. 精確裁切底部 20% MRZ 機讀碼區域並二值化去除雜訊
    function cropMRZOnly(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (e) => {
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const cropH = img.height * 0.20;
            const startY = img.height * 0.80;
            
            canvas.width = img.width;
            canvas.height = cropH;

            ctx.drawImage(img, 0, startY, img.width, cropH, 0, 0, img.width, cropH);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;

            for (let i = 0; i < d.length; i += 4) {
              const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
              const val = gray < 130 ? 0 : 255;
              d[i] = val;
              d[i+1] = val;
              d[i+2] = val;
            }
            ctx.putImageData(imgData, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          };
        };
        reader.readAsDataURL(file);
      });
    }

    // 3. ICAO 9303 固定索引精準切片解析
    function parseStrictMRZ(raw) {
      const cleanLines = raw.split('\n')
        .map(l => l.replace(/[^A-Z0-9<]/g, '').trim())
        .filter(l => l.length >= 20);

      let line1 = '';
      let line2 = '';

      for (let i = 0; i < cleanLines.length; i++) {
        if (cleanLines[i].startsWith('P<') || cleanLines[i].includes('TWN')) {
          line1 = cleanLines[i];
          if (cleanLines[i + 1]) line2 = cleanLines[i + 1];
          break;
        }
      }

      if (!line1 && cleanLines.length >= 2) {
        line1 = cleanLines[cleanLines.length - 2];
        line2 = cleanLines[cleanLines.length - 1];
      }

      let passportNumber = '';
      let englishName = '';
      let birthday = '';
      let nationalId = '';
      let gender = '';

      // 第一排：P<TWNLIN<<MEI<HUA<<<<<<<<<<<<<<<<<<<<<<<
      if (line1) {
        let nameChunk = line1.substring(line1.indexOf('TWN') !== -1 ? line1.indexOf('TWN') + 3 : 5);
        let nameParts = nameChunk.split('<<');
        if (nameParts.length >= 2) {
          let surname = nameParts[0].replace(/</g, '').trim();
          let given = nameParts[1].replace(/<+/g, '-').replace(/-$/, '').trim();
          if (surname) englishName = `${surname}, ${given}`;
        }
      }

      // 第二排：8888000886TWN8801018F2712251A234567893<<<<12
      if (line2) {
        // 1. 護照號碼（前 9 碼）
        let passChunk = line2.substring(0, 9).replace(/[OBISZ]/g, m => ({O:'0',B:'8',I:'1',S:'5',Z:'2'})[m] || m);
        let pMatch = passChunk.match(/[0-9]{8,9}/);
        if (pMatch) passportNumber = pMatch[0];

        // 2. 出生年月日（TWN 後 6 碼 YYMMDD）與性別
        let twnIdx = line2.indexOf('TWN');
        if (twnIdx !== -1 && line2.length >= twnIdx + 9) {
          let dob = line2.substring(twnIdx + 3, twnIdx + 9).replace(/[OBISZ]/g, m => ({O:'0',B:'8',I:'1',S:'5',Z:'2'})[m] || m);
          if (/^[0-9]{6}$/.test(dob)) {
            let yy = parseInt(dob.substring(0, 2), 10);
            let mm = dob.substring(2, 4);
            let dd = dob.substring(4, 6);
            let fullYear = yy > 26 ? `19${dob.substring(0, 2)}` : `20${dob.substring(0, 2)}`;
            birthday = `${fullYear}-${mm}-${dd}`;
          }

          let sexChar = line2.charAt(twnIdx + 10);
          if (sexChar === 'F' || sexChar === 'M') gender = sexChar;
        }

        // 3. 身分證字號（末段 1 碼英文 + 9 碼數字，嚴格校驗第 2 碼為 1 或 2）
        let idSection = line2.substring(20);
        let idMatch = idSection.match(/([A-Z][12][0-9]{8})/);
        if (idMatch) {
          nationalId = idMatch[1];
          if (!gender) gender = nationalId.charAt(1) === '1' ? 'M' : 'F';
        }
      }

      return { passportNumber, englishName, birthday, nationalId, gender };
    }

    // 4. 上傳圖片並辨識
    passportFileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      ocrStatus.classList.remove("hidden");
      ocrStatus.className = "text-xs text-red-400 font-medium mt-2 flex items-center gap-1.5";
      ocrStatus.innerHTML = `
        <svg class="animate-spin h-3.5 w-3.5 text-red-500" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        護照機讀碼辨識中...
      `;

      try {
        const mrzImg = await cropMRZOnly(file);
        const w = await getWorker();
        const { data: { text } } = await w.recognize(mrzImg);
        const res = parseStrictMRZ(text);

        let detected = [];

        if (res.englishName) {
          englishNameInput.value = res.englishName;
          detected.push("英文姓名");
        }
        if (res.passportNumber) {
          passportInput.value = res.passportNumber;
          validatePassport(res.passportNumber);
          detected.push("護照號碼");
        }
        if (res.nationalId) {
          nationalIdInput.value = res.nationalId;
          detected.push("身分證字號");
        }
        if (res.birthday) {
          birthdayInput.value = res.birthday;
          detected.push("出生年月日");
        }
        if (res.gender) {
          genderSelect.value = res.gender;
          detected.push("性別");
        }

        if (detected.length > 0) {
          ocrStatus.className = "text-xs text-emerald-400 font-medium mt-2";
          ocrStatus.innerHTML = `✓ 已帶入：${detected.join("、")}。請手動輸入中文姓名並核對內容。`;
        } else {
          ocrStatus.className = "text-xs text-amber-400 font-medium mt-2";
          ocrStatus.innerHTML = "未能精準識別機讀碼，請手動確認填寫。";
        }
      } catch (err) {
        console.error(err);
        ocrStatus.className = "text-xs text-red-400 font-medium mt-2";
        ocrStatus.innerHTML = "辨識失敗，請手動輸入護照資訊。";
      }
    });

    // 5. 日期與格式防呆
    function getNowString() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    arrivalInput.min = getNowString();
    departureInput.min = getNowString();

    arrivalInput.addEventListener("change", () => {
      const now = new Date();
      const arrivalDate = new Date(arrivalInput.value);
      if (arrivalInput.value && arrivalDate < now) {
        arrivalError.textContent = "抵達時間不能選擇過去的時間！";
        arrivalError.classList.remove("hidden");
        arrivalInput.value = "";
      } else {
        arrivalError.classList.add("hidden");
        if (arrivalInput.value) departureInput.min = arrivalInput.value;
      }
    });

    departureInput.addEventListener("change", () => {
      const arrivalDate = new Date(arrivalInput.value);
      const departureDate = new Date(departureInput.value);
      if (!arrivalInput.value || departureDate <= arrivalDate) {
        departureError.textContent = "離開時間必須晚於抵達時間！";
        departureError.classList.remove("hidden");
        departureInput.value = "";
      } else {
        departureError.classList.add("hidden");
      }
    });

    function validatePassport(val) {
      const valid = /^[A-Z0-9]{6,9}$/.test(val);
      if (!valid) {
        passportError.textContent = "護照號碼應為 6 至 9 碼英數";
        passportError.classList.remove("hidden");
      } else {
        passportError.classList.add("hidden");
      }
      return valid;
    }

    passportInput.addEventListener("input", (e) => {
      let val = e.target.value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
      if (val.length > 9) val = val.slice(0, 9);
      e.target.value = val;
      validatePassport(val);
    });

    englishNameInput.addEventListener("input", (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    nationalIdInput.addEventListener("input", (e) => {
      let val = e.target.value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
      if (val.length > 10) val = val.slice(0, 10);
      e.target.value = val;
    });

    airlineInput.addEventListener("input", (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    // 6. 送出表單
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const passportVal = passportInput.value.trim();
      if (!validatePassport(passportVal)) return passportInput.focus();

      submitBtn.innerText = "資料送出中...";
      submitBtn.disabled = true;

      try {
        await push(ref(db, "guests"), {
          name: nameInput.value.trim(),
          englishName: englishNameInput.value.trim(),
          passport: passportVal,
          nationalId: nationalIdInput.value.trim(),
          birthday: birthdayInput.value,
          gender: genderSelect.value,
          lineNickname: lineNicknameInput.value.trim(),
          airline: airlineInput.value.trim(),
          arrival: arrivalInput.value,
          departure: departureInput.value,
          stayDays: Math.ceil(Math.abs(new Date(departureInput.value) - new Date(arrivalInput.value)) / (1000 * 60 * 60 * 24)) || 1,
          staff: "",
          roomExtendedCount: 0,
          status: "pending",
          createdAt: Date.now()
        });

        formContainer.classList.add("hidden");
        successContainer.classList.remove("hidden");
      } catch (err) {
        alert("送出失敗：" + err.message);
      } finally {
        submitBtn.innerText = "確認送出資料";
        submitBtn.disabled = false;
      }
    });

    window.resetAndReturn = (clearFields) => {
      if (clearFields) {
        form.reset();
        ocrStatus.classList.add("hidden");
        passportError.classList.add("hidden");
        arrivalError.classList.add("hidden");
        departureError.classList.add("hidden");
        arrivalInput.min = getNowString();
        departureInput.min = getNowString();
      }
      successContainer.classList.add("hidden");
      formContainer.classList.remove("hidden");
    };
  </script>
  <style>
    /* 深色模式日曆 icon 顏色反轉 */
    input[type="datetime-local"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>

<body class="bg-neutral-950 text-neutral-100 min-h-screen flex items-center justify-center p-4 selection:bg-red-600 selection:text-white">
  <div class="bg-neutral-900 max-w-lg w-full rounded-2xl shadow-2xl border border-neutral-800 p-6 md:p-8 relative overflow-hidden">
    
    <!-- 頂部質感紅色光暈裝飾 -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-red-600 via-rose-500 to-red-600"></div>

    <div id="formContainer" class="space-y-6">
      <div class="border-b border-neutral-800 pb-4">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
          <h1 class="text-2xl font-black tracking-tight text-white">濟州島行程資料登記</h1>
        </div>
        <p class="text-xs text-neutral-400 mt-1.5">請填寫真實航班與護照資料，以利接待團隊安排接送與房務服務。</p>
      </div>

      <form id="guestForm" class="space-y-4">
        
        <!-- 護照拍照 OCR 快速辨識區 (黑紅主題卡片) -->
        <div class="bg-gradient-to-br from-neutral-900 to-red-950/40 border border-red-900/50 rounded-xl p-4 space-y-2.5 shadow-inner">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-red-400 flex items-center gap-1.5 tracking-wide">
              📷 護照一鍵自動填入
            </span>
            <label for="passportFile" class="text-xs bg-red-600 hover:bg-red-700 active:scale-95 text-white px-3.5 py-1.5 rounded-lg cursor-pointer font-semibold transition shadow-md shadow-red-950">
              拍照 / 上傳護照
            </label>
            <input id="passportFile" type="file" accept="image/*" class="hidden" />
          </div>
          <p class="text-[11px] text-neutral-400 leading-relaxed">拍照上傳後將自動辨識英文姓名、護照號碼、身分證、生日與性別；亦可直接於下方手動輸入。</p>
          <div id="ocrStatus" class="hidden text-xs pt-1"></div>
        </div>

        <!-- 中文真實姓名 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1.5">中文真實姓名 *</label>
          <input id="name" required placeholder="請填寫中文真實姓名（例：林美華）" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm text-neutral-100 placeholder:text-neutral-600 transition" />
        </div>

        <!-- 護照英文姓名 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1.5">護照英文姓名 *</label>
          <input id="englishName" required placeholder="例：LIN, MEI-HUA" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm placeholder:text-neutral-600 uppercase font-mono tracking-wide text-neutral-100 transition" />
          <p class="text-[11px] text-neutral-500 mt-1">※ 請依照護照格式填寫（SURNAME, GIVEN NAME）。</p>
        </div>

        <!-- 護照號碼 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1.5">護照號碼 *</label>
          <input id="passport" maxlength="9" required placeholder="請輸入 6~9 碼護照號碼（例：888800088）" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm font-mono tracking-widest placeholder:text-neutral-600 uppercase text-neutral-100 transition" />
          <p id="passportError" class="hidden text-xs text-red-400 font-medium mt-1"></p>
        </div>

        <!-- 身分證字號 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1.5">身分證字號 / 證件號 *</label>
          <input id="nationalId" maxlength="10" required placeholder="例：A234567893" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm font-mono tracking-wider placeholder:text-neutral-600 uppercase text-neutral-100 transition" />
        </div>

        <!-- 出生年月日 & 性別 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1.5">出生年月日 *</label>
            <input id="birthday" type="date" required class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm text-neutral-100 transition" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1.5">性別 *</label>
            <select id="gender" required class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm text-neutral-100 transition">
              <option value="" class="bg-neutral-900 text-neutral-400">請選擇性別</option>
              <option value="M" class="bg-neutral-900 text-white">男 (Male)</option>
              <option value="F" class="bg-neutral-900 text-white">女 (Female)</option>
            </select>
          </div>
        </div>

        <!-- LINE 社群暱稱 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1.5">LINE 社群中的暱稱 *</label>
          <input id="lineNickname" required placeholder="請輸入您在濟州島交流群內顯示的暱稱" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm placeholder:text-neutral-600 text-neutral-100 transition" />
          <p class="text-[11px] text-neutral-500 mt-1">※ 方便接待專員於群組內即時聯繫確認接送細節。</p>
        </div>

        <!-- 抵達航班代碼 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1.5">抵達航班代碼 *</label>
          <input id="airline" required placeholder="例：KE123、TW701、7C2686" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm placeholder:text-neutral-600 uppercase tracking-wide text-neutral-100 transition" />
        </div>

        <!-- 抵達時間 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1.5">預計抵達濟州島時間 *</label>
          <input id="arrival" type="datetime-local" required class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm text-neutral-100 transition" />
          <p id="arrivalError" class="hidden text-xs text-red-400 font-medium mt-1"></p>
        </div>

        <!-- 離開時間 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1.5">預計離開濟州島時間 *</label>
          <input id="departure" type="datetime-local" required class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm text-neutral-100 transition" />
          <p id="departureError" class="hidden text-xs text-red-400 font-medium mt-1"></p>
        </div>

        <button id="submitBtn" type="submit" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-red-950/60 mt-2">
          確認送出資料
        </button>
      </form>
    </div>

    <!-- 送出成功畫面 (黑紅主題) -->
    <div id="successContainer" class="hidden text-center py-8 space-y-6">
      <div class="w-16 h-16 bg-red-950/80 border border-red-800/80 text-red-400 rounded-full flex items-center justify-center mx-auto text-2xl font-black shadow-lg shadow-red-950">✓</div>
      <div>
        <h2 class="text-xl font-bold text-white tracking-tight">行程資料已成功送出！</h2>
        <p class="text-neutral-400 text-xs mt-2 leading-relaxed max-w-xs mx-auto">接待團隊已收到您的航班與預約資訊，我們將在專屬 LINE 群中與您確認接機細節。</p>
      </div>
      <div class="pt-2 flex flex-col gap-2.5">
        <button onclick="resetAndReturn(false)" class="w-full py-2.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 font-medium rounded-xl text-xs transition border border-neutral-700">
          資料有誤？返回修改剛才送出的內容
        </button>
        <button onclick="resetAndReturn(true)" class="w-full py-2.5 text-red-400 hover:bg-red-950/40 font-medium rounded-xl text-xs transition border border-red-900/40">
          同行旅客填寫（登記下一位）
        </button>
