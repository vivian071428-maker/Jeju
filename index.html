<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>濟州島行程資料登記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const k1 = "AIzaSyChnQOp6dz";
    const k2 = "bohJRCPiOMnA65xVmmUyysV8";

    const firebaseConfig = {
      apiKey: k1 + k2,
      authDomain: "jeju-system.firebaseapp.com",
      databaseURL: "https://jeju-system-default-rtdb.firebaseio.com",
      projectId: "jeju-system",
      storageBucket: "jeju-system.firebasestorage.app",
      messagingSenderId: "918975222741",
      appId: "1:918975222741:web:e9434a6326f522904c635c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const form = document.getElementById("guestForm");
    const formContainer = document.getElementById("formContainer");
    const successContainer = document.getElementById("successContainer");
    const submitBtn = document.getElementById("submitBtn");
    
    const nameInput = document.getElementById("name");
    const englishNameInput = document.getElementById("englishName");
    const passportInput = document.getElementById("passport");
    const nationalIdInput = document.getElementById("nationalId");
    const birthdayInput = document.getElementById("birthday");
    const genderSelect = document.getElementById("gender");
    const passportError = document.getElementById("passportError");
    
    const referrerInput = document.getElementById("referrer");
    const lineNicknameInput = document.getElementById("lineNickname");
    const airlineInput = document.getElementById("airline");
    const arrivalInput = document.getElementById("arrival");
    const returnAirlineInput = document.getElementById("returnAirline");
    const departureInput = document.getElementById("departure");
    const returnBlock = document.getElementById("returnBlock");
    const departureBlock = document.getElementById("departureBlock");
    const departureUncertain = document.getElementById("departureUncertain");
    const noteInput = document.getElementById("note");
    
    const departureError = document.getElementById("departureError");
    const passportFileInput = document.getElementById("passportFile");
    const ocrStatus = document.getElementById("ocrStatus");

    let compressedPassportImageBase64 = ""; // 儲存極小化的護照圖檔

    // 1. 初始化 MRZ Worker
    let worker = null;
    async function initWorker() {
      if (!worker) {
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<',
          tessedit_pageseg_mode: '6'
        });
      }
      return worker;
    }
    initWorker();

    // 智能等比例縮圖壓縮（最長邊 1024px，JPEG 品質 0.65，容量降至 60~90KB）
    function compressImageForStorage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxDimension = 1024;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // 輸出輕量 JPEG 格式
            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.65);
            resolve(compressedDataUrl);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // OCR 專用二值化局部裁切
    function preprocessPassportMRZ(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const startY = img.height * 0.72;
            const cropH = img.height * 0.28;
            
            canvas.width = img.width;
            canvas.height = cropH;

            ctx.drawImage(img, 0, startY, img.width, cropH, 0, 0, img.width, cropH);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
              const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
              const binary = gray < 135 ? 0 : 255;
              data[i] = binary;
              data[i + 1] = binary;
              data[i + 2] = binary;
            }
            ctx.putImageData(imgData, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function parseMRZText(raw) {
      const lines = raw.split('\n')
        .map(l => l.replace(/[^A-Z0-9<]/g, '').trim())
        .filter(l => l.length >= 20);

      let line1 = '';
      let line2 = '';

      for (let i = 0; i < lines.length; i++) {
        if (lines[i].includes('P<') || lines[i].includes('TWN')) {
          line1 = lines[i];
          line2 = lines[i + 1] || '';
          break;
        }
      }

      if (!line1 && lines.length >= 2) {
        line1 = lines[lines.length - 2];
        line2 = lines[lines.length - 1];
      }

      let parsed = {
        englishName: '',
        passportNumber: '',
        birthday: '',
        gender: '',
        nationalId: ''
      };

      if (line1) {
        let nameIdx = line1.indexOf('TWN') !== -1 ? line1.indexOf('TWN') + 3 : line1.indexOf('P<') + 5;
        let nameChunk = line1.substring(nameIdx);
        let parts = nameChunk.split('<<');
        if (parts.length >= 2) {
          let surname = parts[0].replace(/</g, '').trim();
          let given = parts[1].replace(/<+/g, '-').replace(/-+$/, '').trim();
          if (surname) parsed.englishName = `${surname}, ${given}`;
        }
      }

      if (line2) {
        let pChunk = line2.substring(0, 9).replace(/[OBISZ]/g, m => ({O:'0',B:'8',I:'1',S:'5',Z:'2'})[m] || m);
        let pMatch = pChunk.match(/[0-9]{8,9}/);
        if (pMatch) parsed.passportNumber = pMatch[0];

        let twnPos = line2.indexOf('TWN');
        if (twnPos !== -1 && line2.length >= twnPos + 9) {
          let dob = line2.substring(twnPos + 3, twnPos + 9).replace(/[OBISZ]/g, m => ({O:'0',B:'8',I:'1',S:'5',Z:'2'})[m] || m);
          if (/^[0-9]{6}$/.test(dob)) {
            let yy = parseInt(dob.substring(0, 2), 10);
            let mm = dob.substring(2, 4);
            let dd = dob.substring(4, 6);
            let fullYear = yy > 26 ? `19${dob.substring(0, 2)}` : `20${dob.substring(0, 2)}`;
            parsed.birthday = `${fullYear}-${mm}-${dd}`;
          }

          let s = line2.charAt(twnPos + 10);
          if (s === 'F' || s === 'M') parsed.gender = s;
        }

        let idSection = line2.substring(15);
        let idMatch = idSection.match(/([A-Z][12][0-9]{8})/);
        if (idMatch) {
          parsed.nationalId = idMatch[1];
          if (!parsed.gender) parsed.gender = parsed.nationalId.charAt(1) === '1' ? 'M' : 'F';
        }
      }

      return parsed;
    }

    passportFileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      ocrStatus.classList.remove("hidden");
      ocrStatus.className = "text-xs text-red-400 font-medium mt-2 flex items-center gap-1.5";
      ocrStatus.innerHTML = `
        <svg class="animate-spin h-3.5 w-3.5 text-red-500" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        照片壓縮儲存中並進行文字辨識...
      `;

      try {
        // 同步進行高效率圖檔壓縮儲存
        compressedPassportImageBase64 = await compressImageForStorage(file);

        // 執行 OCR 辨識
        const processedImg = await preprocessPassportMRZ(file);
        const w = await initWorker();
        const { data: { text } } = await w.recognize(processedImg);
        const res = parseMRZText(text);

        let detected = [];

        if (res.englishName) {
          englishNameInput.value = res.englishName;
          detected.push("英文姓名");
        }
        if (res.passportNumber) {
          passportInput.value = res.passportNumber;
          validatePassport(res.passportNumber);
          detected.push("護照號碼");
        }
        if (res.nationalId) {
          nationalIdInput.value = res.nationalId;
          formatNationalIdField();
          detected.push("身分證字號");
        }
        if (res.birthday) {
          birthdayInput.value = res.birthday;
          detected.push("出生年月日");
        }
        if (res.gender) {
          genderSelect.value = res.gender;
          detected.push("性別");
        }

        if (detected.length > 0) {
          ocrStatus.className = "text-xs text-emerald-400 font-medium mt-2";
          ocrStatus.innerHTML = `✓ 護照原圖已保存，並自動帶入：${detected.join("、")}。請核對內容。`;
        } else {
          ocrStatus.className = "text-xs text-amber-400 font-medium mt-2";
          ocrStatus.innerHTML = "護照照片已成功保存！若有未能辨識之欄位請手動補填。";
        }
      } catch (err) {
        console.error(err);
        ocrStatus.className = "text-xs text-amber-400 font-medium mt-2";
        ocrStatus.innerHTML = "護照照片已保存，請手動輸入文字欄位。";
      }
    });

    // 2. 勾選「尚未確定離開時間」切換
    departureUncertain.addEventListener("change", (e) => {
      if (e.target.checked) {
        departureInput.value = "";
        returnAirlineInput.value = "";
        departureInput.disabled = true;
        returnAirlineInput.disabled = true;
        departureInput.required = false;
        returnBlock.classList.add("opacity-40", "pointer-events-none");
        departureBlock.classList.add("opacity-40", "pointer-events-none");
        departureError.classList.add("hidden");
      } else {
        departureInput.disabled = false;
        returnAirlineInput.disabled = false;
        departureInput.required = true;
        returnBlock.classList.remove("opacity-40", "pointer-events-none");
        departureBlock.classList.remove("opacity-40", "pointer-events-none");
      }
    });

    function validatePassport(val) {
      const valid = /^[A-Z0-9]{6,9}$/.test(val);
      if (!valid) {
        passportError.textContent = "護照號碼應為 6 至 9 碼英數";
        passportError.classList.remove("hidden");
      } else {
        passportError.classList.add("hidden");
      }
      return valid;
    }

    passportInput.addEventListener("input", (e) => {
      let val = e.target.value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
      if (val.length > 9) val = val.slice(0, 9);
      e.target.value = val;
      validatePassport(val);
    });

    englishNameInput.addEventListener("input", (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    function formatNationalIdField() {
      let clean = nationalIdInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!clean) { nationalIdInput.value = ''; return; }
      let first = clean.charAt(0).replace(/[^A-Z]/g, '');
      let rest = clean.substring(1).replace(/[^0-9]/g, '').slice(0, 9);
      nationalIdInput.value = first + rest;
    }

    nationalIdInput.addEventListener("input", formatNationalIdField);

    airlineInput.addEventListener("input", (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    returnAirlineInput.addEventListener("input", (e) => {
      e.target.value = e.target.value.toUpperCase();
    });

    // 3. 送出表單資料（包含壓縮後的護照圖片 Base64）
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const passportVal = passportInput.value.trim();
      if (!validatePassport(passportVal)) return passportInput.focus();

      let isUncertain = departureUncertain.checked;
      let depValue = isUncertain ? "" : departureInput.value;
      let stayDaysCount = 1;

      if (!isUncertain && depValue && arrivalInput.value) {
        const arrDate = new Date(arrivalInput.value);
        const depDate = new Date(depValue);
        if (depDate <= arrDate) {
          departureError.textContent = "離開起飛時間必須晚於抵達時間！";
          departureError.classList.remove("hidden");
          return departureInput.focus();
        }
        stayDaysCount = Math.ceil(Math.abs(depDate - arrDate) / (1000 * 60 * 60 * 24)) || 1;
      }

      submitBtn.innerText = "資料送出中...";
      submitBtn.disabled = true;

      try {
        await push(ref(db, "guests"), {
          name: nameInput.value.trim(),
          englishName: englishNameInput.value.trim(),
          referrer: referrerInput.value.trim(),
          passport: passportVal,
          nationalId: nationalIdInput.value.trim(),
          birthday: birthdayInput.value,
          gender: genderSelect.value,
          lineNickname: lineNicknameInput.value.trim(),
          airline: airlineInput.value.trim(),
          arrival: arrivalInput.value,
          returnAirline: isUncertain ? "" : returnAirlineInput.value.trim(),
          departure: depValue,
          isDepartureUncertain: isUncertain,
          stayDays: stayDaysCount,
          note: noteInput.value.trim(),
          passportImage: compressedPassportImageBase64 || "", // 輕量化護照縮圖
          points: 0,
          staff: "",
          roomExtendedCount: 0,
          status: "pending",
          housekeepingStatus: "normal",
          createdAt: Date.now()
        });

        formContainer.classList.add("hidden");
        successContainer.classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        alert("送出失敗：" + err.message);
      } finally {
        submitBtn.innerText = "確認送出資料";
        submitBtn.disabled = false;
      }
    });

    window.resetAndReturn = (clearFields) => {
      if (clearFields) {
        form.reset();
        compressedPassportImageBase64 = "";
        if (ocrStatus) ocrStatus.classList.add("hidden");
        if (passportError) passportError.classList.add("hidden");
        if (departureError) departureError.classList.add("hidden");
        departureInput.disabled = false;
        returnAirlineInput.disabled = false;
        departureInput.required = true;
        returnBlock.classList.remove("opacity-40", "pointer-events-none");
        departureBlock.classList.remove("opacity-40", "pointer-events-none");
      }
      successContainer.classList.add("hidden");
      formContainer.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  </script>
  <style>
    input[type="datetime-local"],
    input[type="date"] {
      -webkit-appearance: none;
      min-height: 44px;
      font-size: 14px;
      line-height: normal;
    }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>

<body class="bg-neutral-950 text-neutral-100 min-h-screen flex items-center justify-center p-3 md:p-6 selection:bg-red-600 selection:text-white pb-12">
  <div class="bg-neutral-900 max-w-lg w-full rounded-2xl shadow-2xl border border-neutral-800 p-5 md:p-7 relative overflow-hidden">
    
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-red-600 via-rose-500 to-red-600"></div>

    <div id="formContainer" class="space-y-4">
      <div class="border-b border-neutral-800 pb-3">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
          <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">濟州島行程資料登記</h1>
        </div>
        <p class="text-[11px] text-neutral-400 mt-1">請填寫真實航班與護照資料，以利接待團隊安排接送與房務服務。</p>
      </div>

      <form id="guestForm" class="space-y-3.5">
        
        <!-- 護照拍照 OCR 快速辨識區 -->
        <div class="bg-gradient-to-br from-neutral-900 to-red-950/40 border border-red-900/50 rounded-xl p-3.5 space-y-2 shadow-inner">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-red-400 flex items-center gap-1.5 tracking-wide">
              📷 護照一鍵自動填入
            </span>
            <label for="passportFile" class="text-xs bg-red-600 hover:bg-red-700 active:scale-95 text-white px-3.5 py-1.5 rounded-lg cursor-pointer font-semibold transition shadow-md shadow-red-950">
              拍照 / 上傳護照
            </label>
            <input id="passportFile" type="file" accept="image/*" class="hidden" />
          </div>
          <p class="text-[10px] text-neutral-400 leading-relaxed">拍照上傳後將自動辨識英文姓名、護照號碼、身分證、生日與性別，並自動留存護照圖檔以利核對；亦可直接於下方手動輸入。</p>
          <div id="ocrStatus" class="hidden text-xs pt-0.5"></div>
        </div>

        <!-- 中文真實姓名 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1">中文真實姓名 *</label>
          <input id="name" required placeholder="請填寫中文真實姓名（例：林美華）" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm text-neutral-100 placeholder:text-neutral-600 transition" />
        </div>

        <!-- 護照英文姓名 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1">護照英文姓名 *</label>
          <input id="englishName" required placeholder="例：LIN, MEI-HUA" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm placeholder:text-neutral-600 uppercase font-mono tracking-wide text-neutral-100 transition" />
          <p class="text-[10px] text-neutral-500 mt-0.5">※ 請依照護照格式填寫（SURNAME, GIVEN NAME）。</p>
        </div>

        <!-- 推薦人 (選填) -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-semibold text-neutral-300">推薦人姓名 / 介紹人</label>
            <span class="text-[10px] text-neutral-500">（選填）</span>
          </div>
          <input id="referrer" placeholder="若有介紹人或推薦好友請填寫姓名" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm placeholder:text-neutral-600 text-neutral-100 transition" />
        </div>

        <!-- 護照號碼 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1">護照號碼 *</label>
          <input id="passport" maxlength="9" required placeholder="請輸入 6~9 碼護照號碼（例：888800088）" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm font-mono tracking-widest placeholder:text-neutral-600 uppercase text-neutral-100 transition" />
          <p id="passportError" class="hidden text-xs text-red-400 font-medium mt-1"></p>
        </div>

        <!-- 身分證字號 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1">身分證字號 / 證件號 *</label>
          <input id="nationalId" maxlength="10" required placeholder="例：A234567893" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm font-mono tracking-wider placeholder:text-neutral-600 uppercase text-neutral-100 transition" />
        </div>

        <!-- 出生年月日 & 性別 -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1">出生年月日 *</label>
            <input id="birthday" type="date" required class="w-full px-3 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs text-neutral-100 transition" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1">性別 *</label>
            <select id="gender" required class="w-full px-3 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs text-neutral-100 transition">
              <option value="" class="bg-neutral-900 text-neutral-400">請選擇性別</option>
              <option value="M" class="bg-neutral-900 text-white">男 (Male)</option>
              <option value="F" class="bg-neutral-900 text-white">女 (Female)</option>
            </select>
          </div>
        </div>

        <!-- LINE 社群暱稱 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1">LINE 社群中的暱稱 *</label>
          <input id="lineNickname" required placeholder="請輸入您在濟州島交流群內顯示的暱稱" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm placeholder:text-neutral-600 text-neutral-100 transition" />
          <p class="text-[10px] text-neutral-500 mt-0.5">※ 方便接待專員於群組內即時聯繫確認接送細節。</p>
        </div>

        <!-- 去程抵達航班代碼與時間 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1">抵達航班代碼 *</label>
            <input id="airline" required placeholder="例：KE123、TW701" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm placeholder:text-neutral-600 uppercase tracking-wide text-neutral-100 transition" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-neutral-300 mb-1">預計抵達濟州島時間 *</label>
            <input id="arrival" type="datetime-local" required class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm text-neutral-100 transition" />
          </div>
        </div>

        <!-- 回程離開航班與起飛時間（含不確定離開日勾選） -->
        <div class="space-y-2 pt-1 border-t border-neutral-800/80">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-semibold text-neutral-300">回程航班與起飛時間</label>
            <label class="flex items-center gap-1.5 cursor-pointer select-none text-xs text-red-400 font-medium hover:text-red-300">
              <input id="departureUncertain" type="checkbox" class="w-3.5 h-3.5 rounded bg-neutral-950 border-neutral-800 text-red-600 focus:ring-0 cursor-pointer accent-red-600" />
              <span>尚未確定離開時間</span>
            </label>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div id="returnBlock">
              <label class="block text-xs font-semibold text-neutral-400 mb-1">回程航班代碼</label>
              <input id="returnAirline" placeholder="例：KE124（若已訂請填）" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm placeholder:text-neutral-600 uppercase tracking-wide text-neutral-100 transition" />
            </div>
            <div id="departureBlock">
              <label class="block text-xs font-semibold text-neutral-400 mb-1">預計離開時間 <span class="text-[10px] text-neutral-500">(填入回程起飛時間)</span></label>
              <input id="departure" type="datetime-local" required class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm text-neutral-100 transition" />
            </div>
          </div>
          <p id="departureError" class="hidden text-xs text-red-400 font-medium mt-1"></p>
        </div>

        <!-- 特殊需求與行程備註 -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 mb-1">特殊需求或行程備註</label>
          <input id="note" placeholder="例如：加嬰兒床、同行朋友姓名、特殊飲食等..." class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl outline-none focus:border-red-500 text-xs sm:text-sm text-neutral-100 placeholder:text-neutral-600 transition" />
        </div>

        <button id="submitBtn" type="submit" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-red-950/60 mt-3">
          確認送出資料
        </button>
      </form>
    </div>

    <!-- 送出成功畫面 -->
    <div id="successContainer" class="hidden text-center py-8 space-y-5">
      <div class="w-14 h-14 bg-red-950/80 border border-red-800/80 text-red-400 rounded-full flex items-center justify-center mx-auto text-xl font-black shadow-lg shadow-red-950">✓</div>
      <div>
        <h2 class="text-lg font-bold text-white tracking-tight">行程資料已成功送出！</h2>
        <p class="text-neutral-400 text-xs mt-1.5 leading-relaxed max-w-xs mx-auto">接待團隊已收到您的預約資訊，我們將在專屬 LINE 群中與您確認接機與房務細節。</p>
      </div>
      <div class="pt-2 flex flex-col gap-2">
        <button onclick="resetAndReturn(false)" class="w-full py-2.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 font-medium rounded-xl text-xs transition border border-neutral-700">
          資料有誤？返回修改剛才送出的內容
        </button>
        <button onclick="resetAndReturn(true)" class="w-full py-2.5 text-red-400 hover:bg-red-950/40 font-medium rounded-xl text-xs transition border border-red-900/40">
          同行旅客填寫（登記下一位）
        </button>
      </div>
    </div>

  </div>
</body>
</html>
