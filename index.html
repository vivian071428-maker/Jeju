<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>濟州島貴賓行程與住宿登記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const k1 = "AIzaSyChnQOp6dz";
    const k2 = "bohJRCPiOMnA65xVmmUyysV8";

    const firebaseConfig = {
      apiKey: k1 + k2,
      authDomain: "jeju-system.firebaseapp.com",
      databaseURL: "https://jeju-system-default-rtdb.firebaseio.com",
      projectId: "jeju-system",
      storageBucket: "jeju-system.firebasestorage.app",
      messagingSenderId: "918975222741",
      appId: "1:918975222741:web:e9434a6326f522904c635c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 勾選「尚未確定離開時間」連動隱藏回程時間與班機
    window.toggleDepartureUncertain = () => {
      const checkbox = document.getElementById("departureUncertainCheckbox");
      const departureContainer = document.getElementById("departureDateTimeContainer");
      const returnFlightContainer = document.getElementById("returnFlightContainer");
      const departureInput = document.getElementById("departureInput");
      const returnFlightInput = document.getElementById("returnFlightInput");

      if (checkbox.checked) {
        departureContainer.classList.add("opacity-40", "pointer-events-none");
        returnFlightContainer.classList.add("opacity-40", "pointer-events-none");
        departureInput.required = false;
        departureInput.value = "";
        returnFlightInput.value = "";
      } else {
        departureContainer.classList.remove("opacity-40", "pointer-events-none");
        returnFlightContainer.classList.remove("opacity-40", "pointer-events-none");
        departureInput.required = true;
      }
    };

    window.handleSubmit = (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "正在安全提交登記資料...";

      const isUncertain = document.getElementById("departureUncertainCheckbox").checked;

      const guestData = {
        name: document.getElementById("name").value.trim(),
        englishName: document.getElementById("englishName").value.trim().toUpperCase(),
        referrer: document.getElementById("referrer").value.trim(),
        gender: document.getElementById("gender").value,
        birthday: document.getElementById("birthday").value,
        passport: document.getElementById("passport").value.trim().toUpperCase(),
        nationalId: document.getElementById("nationalId").value.trim().toUpperCase(),
        lineNickname: document.getElementById("lineNickname").value.trim(),
        airline: document.getElementById("airline").value.trim().toUpperCase(),
        arrival: document.getElementById("arrival").value,
        returnAirline: isUncertain ? "" : document.getElementById("returnFlightInput").value.trim().toUpperCase(),
        departure: isUncertain ? "" : document.getElementById("departureInput").value,
        isDepartureUncertain: isUncertain,
        stayDays: isUncertain ? 1 : (parseInt(document.getElementById("stayDays").value, 10) || 1),
        note: document.getElementById("note").value.trim(),
        status: "pending",
        createdAt: Date.now()
      };

      push(ref(db, "guests"), guestData)
        .then(() => {
          document.getElementById("formContainer").classList.add("hidden");
          document.getElementById("successModal").classList.remove("hidden");
        })
        .catch((error) => {
          alert("登記提交失敗，請檢查網路連線或稍後再試: " + error.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "確認並送出行程登記";
        });
    };
  </script>
  <style>
    input[type="date"],
    input[type="datetime-local"] {
      -webkit-appearance: none;
      min-height: 44px;
      font-size: 14px !important;
      line-height: normal;
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>

<body class="bg-neutral-950 text-neutral-100 min-h-screen p-4 sm:p-8 flex items-center justify-center selection:bg-red-600 selection:text-white">

  <div class="max-w-xl w-full">
    
    <div id="successModal" class="hidden bg-neutral-900 border border-neutral-800 rounded-3xl p-8 text-center space-y-4 shadow-2xl">
      <div class="w-16 h-16 bg-red-950 border border-red-800 text-red-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
      <h2 class="text-2xl font-black text-white">行程登記已完成！</h2>
      <p class="text-neutral-400 text-xs sm:text-sm leading-relaxed">
        感謝您填寫濟州島行程與住宿需求。接待專員已收到您的資訊，將竭誠為您準備最完善的接送與住宿安排！
      </p>
      <button onclick="location.reload()" class="mt-4 px-6 py-2.5 bg-neutral-800 hover:bg-neutral-750 text-white rounded-xl text-xs font-semibold transition">
        填寫下一筆
      </button>
    </div>

    <div id="formContainer" class="bg-neutral-900 border border-neutral-800/90 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
      
      <div class="border-b border-neutral-800 pb-4">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
          <span class="text-xs uppercase tracking-widest text-red-500 font-bold">Jeju Island VIP Registration</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-white mt-1">濟州島行程與住宿登記</h1>
        <p class="text-xs text-neutral-400 mt-1">請填寫您的基本資料與航班起降時間，以利專員為您安排專車與房務安排。</p>
      </div>

      <form onsubmit="handleSubmit(event)" class="space-y-4 text-xs">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">中文真實姓名 <span class="text-red-500">*</span></label>
            <input id="name" required placeholder="例如：王小明" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 transition" />
          </div>
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">護照英文姓名 <span class="text-red-500">*</span></label>
            <input id="englishName" required placeholder="例如：WANG XIAOMING" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white font-mono uppercase outline-none focus:border-red-500 transition" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">介紹人 / 推薦人姓名</label>
            <input id="referrer" placeholder="若無可填寫 無" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 transition" />
          </div>
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">性別 <span class="text-red-500">*</span></label>
            <select id="gender" required class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 transition font-medium">
              <option value="M">男 (Male)</option>
              <option value="F">女 (Female)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">出生年月日 <span class="text-red-500">*</span></label>
            <input id="birthday" type="date" required class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 transition" />
          </div>
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">身分證字號 <span class="text-red-500">*</span></label>
            <input id="nationalId" required placeholder="例如：A123456789" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white font-mono uppercase outline-none focus:border-red-500 transition" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">護照號碼 <span class="text-red-500">*</span></label>
            <input id="passport" required placeholder="例如：312345678" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white font-mono uppercase outline-none focus:border-red-500 transition" />
          </div>
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">LINE 暱稱 / 聯絡方式 <span class="text-red-500">*</span></label>
            <input id="lineNickname" required placeholder="方便接機群組辨識" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 transition" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-neutral-800/60">
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">抵達航班代碼 <span class="text-red-500">*</span></label>
            <input id="airline" required placeholder="例如：IT654 / TW668" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white uppercase outline-none focus:border-red-500 transition" />
          </div>
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">預計抵達濟州時間 (抵達降落) <span class="text-red-500">*</span></label>
            <input id="arrival" type="datetime-local" required class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 transition" />
          </div>
        </div>

        <div class="pt-2 space-y-3">
          <div class="flex items-center justify-between">
            <label class="font-semibold text-neutral-300">回程離境資訊</label>
            <label class="flex items-center gap-1.5 cursor-pointer select-none text-xs text-amber-400 hover:text-amber-300">
              <input id="departureUncertainCheckbox" type="checkbox" onchange="toggleDepartureUncertain()" class="w-4 h-4 rounded bg-neutral-950 border-neutral-800 text-red-600 focus:ring-0 cursor-pointer accent-red-600" />
              <span>尚未確定離開時間（免填回程班機與時間）</span>
            </label>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div id="returnFlightContainer">
              <label class="block font-semibold text-neutral-300 mb-1">回程班機號碼</label>
              <input id="returnFlightInput" placeholder="例如：IT655 / 7C2686 (若有訂請填)" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white uppercase outline-none focus:border-red-500 transition" />
            </div>

            <div id="departureDateTimeContainer">
              <label class="block font-semibold text-neutral-300 mb-1">預計離開濟州時間 <span class="text-neutral-400 font-normal">(請填入回程班機起飛時間)</span></label>
              <input id="departureInput" type="datetime-local" required class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 transition" />
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block font-semibold text-neutral-300 mb-1">預計停留晚數</label>
            <input id="stayDays" type="number" min="1" max="60" value="3" class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 transition" />
          </div>
          <div class="sm:col-span-2">
            <label class="block font-semibold text-neutral-300 mb-1">特殊需求或備註說明</label>
            <input id="note" placeholder="例如：需要嬰兒床、同行朋友姓名、特殊飲食等..." class="w-full px-3.5 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 transition" />
          </div>
        </div>

        <div class="pt-3">
          <button id="submitBtn" type="submit" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-red-950 active:scale-[0.99]">
            確認並送出行程登記
          </button>
        </div>

      </form>

    </div>

  </div>

</body>
</html>
