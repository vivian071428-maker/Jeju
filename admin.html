<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>濟州島行程與房務管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const k1 = "AIzaSyChnQOp6dz";
    const k2 = "bohJRCPiOMnA65xVmmUyysV8";

    const firebaseConfig = {
      apiKey: k1 + k2,
      authDomain: "jeju-system.firebaseapp.com",
      databaseURL: "https://jeju-system-default-rtdb.firebaseio.com",
      projectId: "jeju-system",
      storageBucket: "jeju-system.firebasestorage.app",
      messagingSenderId: "918975222741",
      appId: "1:918975222741:web:e9434a6326f522904c635c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allGuests = {};
    let activeTab = 'roster'; 
    let currentFilter = 'all'; 
    let clientTypeFilter = 'all'; 
    let unmaskedIds = new Set();
    const ADMIN_PIN = "8888";

    // 1. PIN 驗證
    const authOverlay = document.getElementById("authOverlay");
    const adminPinInput = document.getElementById("adminPin");
    const pinError = document.getElementById("pinError");
    const unlockBtn = document.getElementById("unlockBtn");

    unlockBtn.addEventListener("click", () => {
      if (adminPinInput.value === ADMIN_PIN) {
        authOverlay.classList.add("hidden");
        loadDatabaseListener();
      } else {
        pinError.classList.remove("hidden");
        adminPinInput.value = "";
      }
    });

    // 2. 監聽資料庫
    function loadDatabaseListener() {
      const guestsRef = ref(db, "guests");
      onValue(guestsRef, (snapshot) => {
        allGuests = snapshot.val() || {};
        renderDashboard();
      });
    }

    function maskString(str, visibleChars = 4) {
      if (!str) return '-';
      if (str.length <= visibleChars) return str;
      return str.substring(0, visibleChars) + '****';
    }

    // 3. 客戶分析運算引擎
    function buildClientProfileMap(guestList) {
      const profileMap = {};

      guestList.forEach(g => {
        const key = (g.passport || g.nationalId || g.name || g.id).trim().toUpperCase();
        if (!profileMap[key]) {
          profileMap[key] = {
            totalPoints: 0,
            allVisits: [],
            historyVisits: []
          };
        }
        
        profileMap[key].allVisits.push(g);

        const isClosed = (g.status === 'completed' || g.housekeepingStatus === 'closed');
        if (isClosed) {
          profileMap[key].totalPoints += parseInt(g.points || 0, 10);
          profileMap[key].historyVisits.push(g);
        }
      });

      Object.keys(profileMap).forEach(key => {
        const p = profileMap[key];
        p.allVisits.sort((a, b) => (b.createdAt || new Date(b.arrival).getTime()) - (a.createdAt || new Date(a.arrival).getTime()));
        p.historyVisits.sort((a, b) => (b.createdAt || new Date(b.arrival).getTime()) - (a.createdAt || new Date(a.arrival).getTime()));

        if (p.allVisits.length <= 1) {
          p.clientType = 'other';
          p.clientTypeLabel = '新客/單次';
        } else {
          let totalGapDays = 0;
          for (let i = 1; i < p.allVisits.length; i++) {
            const prev = new Date(p.allVisits[i - 1].arrival).getTime();
            const curr = new Date(p.allVisits[i].arrival).getTime();
            totalGapDays += Math.abs((curr - prev) / (1000 * 60 * 60 * 24));
          }
          const avgGap = totalGapDays / (p.allVisits.length - 1);

          if (avgGap <= 35) {
            p.clientType = 'long';
            p.clientTypeLabel = '長期客戶 (頻繁)';
          } else {
            p.clientType = 'short';
            p.clientTypeLabel = '短期客戶 (偶爾)';
          }
        }
      });

      return profileMap;
    }

    // 房務倒數運算
    function getHousekeepingAlertLevel(g, now) {
      if (g.housekeepingStatus === 'closed' || g.status === 'completed' || g.status === 'cancelled') {
        return 'closed';
      }

      const arrTime = new Date(g.arrival).getTime();
      const depTime = g.departure ? new Date(g.departure).getTime() : 0;

      if (now < arrTime) return 'upcoming';
      if (!depTime || g.isDepartureUncertain) return 'normal';
      if (now > depTime) return 'overdue';

      const timeLeftHours = (depTime - now) / (1000 * 60 * 60);

      if (timeLeftHours <= 24) {
        return 'alert24';
      } else if (timeLeftHours <= 48) {
        return 'care48';
      } else {
        return 'normal';
      }
    }

    // 4. 渲染主儀表板
    function renderDashboard() {
      const guestList = Object.entries(allGuests)
        .map(([id, data]) => ({ id, ...data }))
        .sort((a, b) => (b.createdAt || new Date(b.arrival).getTime()) - (a.createdAt || new Date(a.arrival).getTime()));

      const now = new Date().getTime();
      const profileMap = buildClientProfileMap(guestList);

      let total = guestList.length;
      let care48Count = 0;
      let alert24Count = 0;
      let inIslandCount = 0;

      guestList.forEach(g => {
        const arrTime = new Date(g.arrival).getTime();
        const depTime = g.departure ? new Date(g.departure).getTime() : 0;

        if (now >= arrTime && (g.isDepartureUncertain || !depTime || now <= depTime)) {
          inIslandCount++;
        }

        const level = getHousekeepingAlertLevel(g, now);
        if (level === 'care48') care48Count++;
        if (level === 'alert24') alert24Count++;
      });

      document.getElementById("statTotal").innerText = total;
      document.getElementById("statCare48").innerText = care48Count;
      document.getElementById("statAlert24").innerText = alert24Count;
      document.getElementById("statInIsland").innerText = inIslandCount;

      updateCardActiveStyles();
      updateClientFilterBtnStyles();
      renderRoster(guestList, now, profileMap);
      renderHousekeepingList(guestList, now, profileMap);
    }

    function updateCardActiveStyles() {
      const cards = {
        'all': document.getElementById("cardAll"),
        'inIsland': document.getElementById("cardInIsland"),
        'care48': document.getElementById("cardCare48"),
        'alert24': document.getElementById("cardAlert24")
      };

      Object.entries(cards).forEach(([key, el]) => {
        if (!el) return;
        if (currentFilter === key) {
          el.classList.add("ring-2", "ring-red-500", "bg-neutral-800");
        } else {
          el.classList.remove("ring-2", "ring-red-500", "bg-neutral-800");
        }
      });
    }

    function updateClientFilterBtnStyles() {
      const btns = {
        'all': document.getElementById("btnClientAll"),
        'long': document.getElementById("btnClientLong"),
        'short': document.getElementById("btnClientShort"),
        'other': document.getElementById("btnClientOther")
      };

      Object.entries(btns).forEach(([key, el]) => {
        if (!el) return;
        if (clientTypeFilter === key) {
          el.className = "px-3 py-1.5 rounded-xl text-xs font-bold bg-red-600 text-white shadow-sm";
        } else {
          el.className = "px-3 py-1.5 rounded-xl text-xs font-medium bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white";
        }
      });
    }

    function getFilteredGuests(profileMap) {
      const guestList = Object.entries(allGuests)
        .map(([id, data]) => ({ id, ...data }))
        .sort((a, b) => (b.createdAt || new Date(b.arrival).getTime()) - (a.createdAt || new Date(a.arrival).getTime()));

      const now = new Date().getTime();
      const searchVal = document.getElementById("searchInput").value.toLowerCase();

      let filtered = guestList.filter(g => {
        const arrTime = new Date(g.arrival).getTime();
        const depTime = g.departure ? new Date(g.departure).getTime() : 0;
        const level = getHousekeepingAlertLevel(g, now);
        const key = (g.passport || g.nationalId || g.name || g.id).trim().toUpperCase();
        const cType = profileMap[key]?.clientType || 'other';

        if (currentFilter === 'inIsland' && !(now >= arrTime && (g.isDepartureUncertain || !depTime || now <= depTime))) return false;
        if (currentFilter === 'care48' && level !== 'care48') return false;
        if (currentFilter === 'alert24' && level !== 'alert24') return false;

        if (clientTypeFilter !== 'all' && cType !== clientTypeFilter) return false;

        return true;
      });

      return filtered.filter(g => {
        return (g.name || "").toLowerCase().includes(searchVal) ||
               (g.englishName || "").toLowerCase().includes(searchVal) ||
               (g.memberId || "").toLowerCase().includes(searchVal) ||
               (g.passport || "").toLowerCase().includes(searchVal) ||
               (g.nationalId || "").toLowerCase().includes(searchVal) ||
               (g.lineNickname || "").toLowerCase().includes(searchVal) ||
               (g.airline || "").toLowerCase().includes(searchVal) ||
               (g.staff || "").toLowerCase().includes(searchVal) ||
               (g.note || "").toLowerCase().includes(searchVal);
      });
    }

    // 5. 渲染旅客行程總表
    function renderRoster(guestList, now, profileMap) {
      const container = document.getElementById("rosterContainer");
      const filtered = getFilteredGuests(profileMap);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-neutral-500 text-xs">查無符合條件的旅客資料</div>`;
        return;
      }

      container.innerHTML = filtered.map(g => {
        const isUnmasked = unmaskedIds.has(g.id);
        const passText = isUnmasked ? (g.passport || '-') : maskString(g.passport, 4);
        const idText = isUnmasked ? (g.nationalId || '-') : maskString(g.nationalId, 3);
        const eyeIcon = isUnmasked 
          ? `<svg class="w-3.5 h-3.5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>`
          : `<svg class="w-3.5 h-3.5 text-neutral-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`;

        let statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-neutral-800 text-neutral-300">待確認</span>`;
        if (g.status === 'confirmed') statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-950 text-blue-400 border border-blue-800/60">已確認</span>`;
        if (g.status === 'checked_in') statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-800/60">已入住</span>`;
        if (g.status === 'completed') statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-neutral-800 text-neutral-400">已完成</span>`;
        if (g.status === 'cancelled') statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-950 text-rose-400 border border-rose-800/60">已取消</span>`;

        const pKey = (g.passport || g.nationalId || g.name || g.id).trim().toUpperCase();
        const profile = profileMap[pKey] || { totalPoints: 0, clientType: 'other', allVisits: [], historyVisits: [] };
        
        let clientTypeTag = `<span class="px-1.5 py-0.5 rounded bg-neutral-800 text-neutral-400 text-[10px] font-medium">⚪ 新客</span>`;
        if (profile.clientType === 'long') {
          clientTypeTag = `<span class="px-1.5 py-0.5 rounded bg-red-950 border border-red-800/60 text-red-300 text-[10px] font-bold">💎 長期客戶</span>`;
        } else if (profile.clientType === 'short') {
          clientTypeTag = `<span class="px-1.5 py-0.5 rounded bg-amber-950 border border-amber-800/60 text-amber-300 text-[10px] font-bold">🌟 短期客戶</span>`;
        }

        const departureText = g.isDepartureUncertain 
          ? `<span class="text-amber-400 font-medium">尚未確定</span>` 
          : (g.departure ? g.departure.replace('T', ' ') : '-');

        return `
          <div class="bg-neutral-900 border border-neutral-800/90 rounded-2xl p-4 space-y-3 shadow-lg hover:border-neutral-700 transition">
            <div class="flex items-center justify-between gap-2 border-b border-neutral-800 pb-2.5">
              <button onclick="openEditDrawer('${g.id}')" class="text-left group flex items-center gap-1.5 flex-wrap">
                <span class="text-base font-bold text-white group-hover:text-red-400 transition underline underline-offset-4 decoration-neutral-700 group-hover:decoration-red-400">
                  ${g.name || '未填寫'}
                </span>
                <span class="text-xs text-neutral-400 font-mono">(${g.englishName || '-'})</span>
                ${clientTypeTag}
                ${g.memberId ? `<span class="px-1.5 py-0.5 rounded bg-neutral-800 border border-neutral-700 text-red-400 font-mono text-[10px] font-bold">🆔 ${g.memberId}</span>` : ''}
                <span class="text-[10px] text-red-500 font-normal">✎ 修改</span>
              </button>
              <div>${statusBadge}</div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-neutral-400">
              <div class="space-y-1">
                <div class="flex items-center gap-1.5 font-mono text-neutral-300">
                  <span>護照: ${passText}</span>
                  <button onclick="toggleMask('${g.id}')" class="p-0.5 rounded hover:bg-neutral-800 transition" title="切換遮罩">
                    ${eyeIcon}
                  </button>
                </div>
                <div class="text-[11px] text-neutral-500 font-mono">身分證: ${idText}</div>
                <div>LINE: <span class="text-red-400 font-medium">${g.lineNickname || '-'}</span></div>
                <div class="text-amber-400 font-mono font-medium">🏆 結案累積點數: <span class="text-white font-bold">${profile.totalPoints}</span> 點 <span class="text-[10px] text-neutral-500">(已結案: ${profile.historyVisits.length} 次)</span></div>
              </div>

              <div class="space-y-1">
                <div>航班: <span class="bg-neutral-800 text-red-300 px-1.5 py-0.5 rounded font-mono font-bold text-[11px]">${g.airline || '-'}</span></div>
                <div>抵達: <span class="text-neutral-300">${g.arrival ? g.arrival.replace('T', ' ') : '-'}</span></div>
                <div>離開: <span class="text-neutral-300">${departureText}</span> <span class="text-neutral-500">(${g.isDepartureUncertain ? '天數未定' : (g.stayDays || 1) + ' 晚'})</span></div>
                <div>本次發放點數: <span class="text-neutral-200 font-mono font-bold">${g.points || 0}</span> 點</div>
              </div>
            </div>

            ${g.note ? `
              <div class="bg-neutral-950/70 border border-neutral-800 rounded-xl p-2 text-[11px] text-amber-300/90 flex items-start gap-1.5">
                <span class="text-amber-500">📌</span>
                <span class="truncate">${g.note}</span>
              </div>
            ` : ''}

            <div class="flex items-center justify-between pt-1 border-t border-neutral-800/60 text-xs">
              <div class="text-[11px] text-neutral-400">專員: <span class="text-neutral-200 font-medium">${g.staff || '未指派'}</span></div>
              <div class="flex items-center gap-2">
                <button onclick="openEditDrawer('${g.id}')" class="px-2.5 py-1 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 rounded-lg text-xs font-medium transition">
                  歷史紀錄 / 修改
                </button>
                <button onclick="deleteGuest('${g.id}')" class="px-2 py-1 text-neutral-500 hover:text-red-400 transition text-xs">
                  刪除
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // 6. 渲染房務警戒看板
    function renderHousekeepingList(guestList, now, profileMap) {
      const container = document.getElementById("housekeepingCards");
      
      let activeStayGuests = guestList.filter(g => {
        const arrTime = new Date(g.arrival).getTime();
        const depTime = g.departure ? new Date(g.departure).getTime() : 0;
        const level = getHousekeepingAlertLevel(g, now);

        if (level === 'closed') return false;

        if (currentFilter === 'inIsland') return (now >= arrTime && (g.isDepartureUncertain || !depTime || now <= depTime));
        if (currentFilter === 'care48') return (level === 'care48');
        if (currentFilter === 'alert24') return (level === 'alert24');
        return true;
      });

      if (activeStayGuests.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-neutral-500 text-xs">目前無符合此篩選條件的房務或警戒名單。</div>`;
        return;
      }

      container.innerHTML = activeStayGuests.map(g => {
        const level = getHousekeepingAlertLevel(g, now);
        const depTime = g.departure ? new Date(g.departure).getTime() : 0;
        const timeLeftHours = depTime ? Math.max(0, (depTime - now) / (1000 * 60 * 60)) : 0;
        const nightsRemaining = Math.ceil(timeLeftHours / 24);
        
        let badge = `<span class="bg-neutral-800 text-neutral-300 text-[10px] px-2 py-0.5 rounded-full font-bold">正常住宿中 ${g.isDepartureUncertain ? '(未定離開日)' : `(剩 ${nightsRemaining} 晚)`}</span>`;
        let cardBorder = "border-neutral-800";

        if (level === 'alert24') {
          badge = `<span class="bg-red-950 border border-red-800 text-red-400 text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse">🔴 倒數第 1 晚・訂房警戒</span>`;
          cardBorder = "border-red-800/80 bg-red-950/20";
        } else if (level === 'care48') {
          badge = `<span class="bg-amber-950 border border-amber-800 text-amber-400 text-[10px] px-2 py-0.5 rounded-full font-bold">🟡 倒數第 2 晚・關懷名單</span>`;
          cardBorder = "border-amber-800/60 bg-amber-950/10";
        } else if (level === 'overdue') {
          badge = `<span class="bg-neutral-800 text-rose-400 text-[10px] px-2 py-0.5 rounded-full font-bold">已逾期 / 今日退房</span>`;
        }

        const pKey = (g.passport || g.nationalId || g.name || g.id).trim().toUpperCase();
        const profile = profileMap[pKey] || { totalPoints: 0, clientType: 'other', allVisits: [], historyVisits: [] };

        const departureText = g.isDepartureUncertain 
          ? `<span class="text-amber-400 font-medium">尚未確定</span>` 
          : (g.departure ? g.departure.split('T')[0] : '-');

        return `
          <div class="border ${cardBorder} bg-neutral-900 rounded-2xl p-4 flex flex-col justify-between gap-3 shadow-lg">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <button onclick="openEditDrawer('${g.id}')" class="text-sm font-bold text-white hover:text-red-400 transition text-left underline decoration-neutral-700 flex items-center gap-1">
                  <span>${g.name || '未填'}</span>
                  <span class="text-xs font-normal text-neutral-400">(${g.englishName || '-'})</span>
                  ${g.memberId ? `<span class="text-[10px] text-red-400 font-mono font-bold">#${g.memberId}</span>` : ''}
                  <span class="text-[10px] text-red-500 font-normal">✎</span>
                </button>
                ${badge}
              </div>
              <div class="text-xs text-neutral-400 space-y-1">
                <div>客群: <span class="text-neutral-200">${profile.clientType === 'long' ? '💎 長期客戶' : (profile.clientType === 'short' ? '🌟 短期客戶' : '⚪ 新客')}</span> | 累積點數: <span class="text-amber-400 font-bold">${profile.totalPoints}</span> 點</div>
                <div>LINE: <span class="text-neutral-200 font-medium">${g.lineNickname || '-'}</span></div>
                <div>期間: <span class="text-neutral-200 font-mono">${g.arrival ? g.arrival.split('T')[0] : '-'} ~ ${departureText}</span></div>
                <div>住宿天數: <span class="text-red-400 font-bold font-mono">${g.isDepartureUncertain ? '尚未確定' : (g.stayDays || 1) + ' 晚'}</span> ${!g.isDepartureUncertain && timeLeftHours ? `(剩餘約: ${Math.round(timeLeftHours)} 小時)` : ''}</div>
                <div>專員: <span class="text-neutral-200">${g.staff || '未指派'}</span></div>
                ${g.note ? `<div class="text-amber-400/90 text-[11px] pt-1">📌 備註: ${g.note}</div>` : ''}
              </div>
            </div>

            <div class="pt-3 border-t border-neutral-800/80 flex flex-col gap-2">
              <button onclick="copyLineCareText('${g.name}', '${g.staff || '接待專員'}', '${g.departure || '未定'}', ${nightsRemaining})" class="w-full py-1.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs font-medium rounded-xl transition">
                📋 複製 LINE 關懷話術
              </button>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="openExtendModal('${g.id}', ${g.stayDays || 1})" class="py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl transition shadow-md shadow-red-950">
                  + 續住加訂
                </button>
                <button onclick="closeStayCase('${g.id}')" class="py-2 bg-neutral-950 border border-neutral-700 hover:bg-neutral-800 text-neutral-300 text-xs font-medium rounded-xl transition">
                  ✓ 結案退房
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // 7. 一鍵匯出 CSV
    window.exportToCSV = () => {
      const guestList = Object.entries(allGuests).map(([id, data]) => ({ id, ...data }));
      const profileMap = buildClientProfileMap(guestList);
      const list = getFilteredGuests(profileMap);

      if (list.length === 0) {
        alert("目前清單中沒有任何旅客資料可供匯出！");
        return;
      }

      const headers = [
        "會員編號", "中文姓名", "護照英文姓名", "護照號碼", "身分證字號", "客群分類",
        "結案累積總點數", "本次點數", "性別", "出生年月日", "LINE暱稱",
        "抵達航班", "抵達時間", "離開時間", "停留晚數", "接待專員", "狀態", "備註"
      ];

      const rows = list.map(g => {
        const pKey = (g.passport || g.nationalId || g.name || g.id).trim().toUpperCase();
        const p = profileMap[pKey] || { totalPoints: 0, clientTypeLabel: '新客' };

        return [
          `"${(g.memberId || '').replace(/"/g, '""')}"`,
          `"${(g.name || '').replace(/"/g, '""')}"`,
          `"${(g.englishName || '').replace(/"/g, '""')}"`,
          `"${(g.passport || '').replace(/"/g, '""')}"`,
          `"${(g.nationalId || '').replace(/"/g, '""')}"`,
          `"${p.clientTypeLabel}"`,
          `"${p.totalPoints}"`,
          `"${g.points || 0}"`,
          `"${g.gender === 'M' ? '男' : (g.gender === 'F' ? '女' : '')}"`,
          `"${g.birthday || ''}"`,
          `"${(g.lineNickname || '').replace(/"/g, '""')}"`,
          `"${(g.airline || '').replace(/"/g, '""')}"`,
          `"${(g.arrival || '').replace('T', ' ')}"`,
          `"${g.isDepartureUncertain ? '尚未確定' : (g.departure || '').replace('T', ' ')}"`,
          `"${g.isDepartureUncertain ? '未定' : (g.stayDays || 1)}"`,
          `"${(g.staff || '').replace(/"/g, '""')}"`,
          `"${g.status || 'pending'}"`,
          `"${(g.note || '').replace(/"/g, '""')}"`
        ];
      });

      const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      const dateStr = new Date().toISOString().split('T')[0];
      link.setAttribute("href", url);
      link.setAttribute("download", `濟州島旅客名單_${currentFilter}_${clientTypeFilter}_${dateStr}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    // 8. 篩選切換
    window.setCardFilter = (type) => {
      currentFilter = (currentFilter === type) ? 'all' : type;
      renderDashboard();
    };

    window.setClientTypeFilter = (type) => {
      clientTypeFilter = type;
      renderDashboard();
    };

    window.toggleMask = (id) => {
      if (unmaskedIds.has(id)) {
        unmaskedIds.delete(id);
      } else {
        unmaskedIds.add(id);
      }
      renderDashboard();
    };

    // 9. 編輯 / 歷史紀錄 Drawer 彈窗
    let editingGuestId = null;

    window.openEditDrawer = (id) => {
      editingGuestId = id;
      const g = allGuests[id];
      if (!g) return;

      const guestList = Object.entries(allGuests).map(([i, d]) => ({ id: i, ...d }));
      const profileMap = buildClientProfileMap(guestList);
      const pKey = (g.passport || g.nationalId || g.name || g.id).trim().toUpperCase();
      const profile = profileMap[pKey] || { totalPoints: 0, clientTypeLabel: '新客', allVisits: [], historyVisits: [] };

      document.getElementById("editMemberId").value = g.memberId || '';
      document.getElementById("editName").value = g.name || '';
      document.getElementById("editEnglishName").value = g.englishName || '';
      document.getElementById("editPassport").value = g.passport || '';
      document.getElementById("editNationalId").value = g.nationalId || '';
      document.getElementById("editBirthday").value = g.birthday || '';
      document.getElementById("editGender").value = g.gender || 'M';
      document.getElementById("editLineNickname").value = g.lineNickname || '';
      document.getElementById("editAirline").value = g.airline || '';
      document.getElementById("editArrival").value = g.arrival || '';
      document.getElementById("editDeparture").value = g.departure || '';
      document.getElementById("editDepartureUncertain").checked = !!g.isDepartureUncertain;
      document.getElementById("editStayDays").value = g.stayDays || 1;
      document.getElementById("editStaff").value = g.staff || '';
      document.getElementById("editStatus").value = g.status || 'pending';
      document.getElementById("editPoints").value = g.points || 0;
      document.getElementById("editNote").value = g.note || '';

      document.getElementById("drawerTotalPoints").innerText = profile.totalPoints;
      document.getElementById("drawerVisitCount").innerText = profile.historyVisits.length;
      document.getElementById("drawerClientTag").innerText = profile.clientTypeLabel;

      const historyListContainer = document.getElementById("historyListContainer");
      if (profile.historyVisits.length === 0) {
        historyListContainer.innerHTML = `<div class="text-neutral-500 text-xs text-center py-2">尚無已結案的歷史來訪紀錄。</div>`;
      } else {
        historyListContainer.innerHTML = profile.historyVisits.map((v, idx) => `
          <div class="bg-neutral-950 border border-neutral-800/80 rounded-xl p-3 text-xs space-y-1">
            <div class="flex items-center justify-between text-neutral-300 font-medium">
              <span>歷史行程 #${idx + 1}：${v.arrival ? v.arrival.split('T')[0] : '-'} ~ ${v.departure ? v.departure.split('T')[0] : '未定'}</span>
              <span class="text-amber-400 font-bold font-mono">+${v.points || 0} 點</span>
            </div>
            <div class="text-neutral-500 flex items-center justify-between text-[11px]">
              <span>航班: ${v.airline || '-'} | 晚數: ${v.stayDays || 1} 晚 | 專員: ${v.staff || '未指派'}</span>
              <span class="text-emerald-400/90 font-medium">已結案</span>
            </div>
            ${v.note ? `<div class="text-amber-400/80 text-[10px] pt-0.5">備註: ${v.note}</div>` : ''}
          </div>
        `).join("");
      }

      document.getElementById("historyDrawerSection").classList.add("hidden");
      document.getElementById("toggleHistoryBtn").innerText = `📜 展開已結案歷史行程 (${profile.historyVisits.length} 次)`;
      document.getElementById("editDrawerModal").classList.remove("hidden");
    };

    window.toggleHistorySection = () => {
      const section = document.getElementById("historyDrawerSection");
      const btn = document.getElementById("toggleHistoryBtn");
      if (section.classList.contains("hidden")) {
        section.classList.remove("hidden");
        btn.innerText = "🔼 收起歷史行程明細";
      } else {
        section.classList.add("hidden");
        btn.innerText = "📜 展開已結案歷史行程";
      }
    };

    window.closeEditDrawer = () => {
      document.getElementById("editDrawerModal").classList.add("hidden");
      editingGuestId = null;
    };

    window.saveGuestDetails = () => {
      if (!editingGuestId) return;

      const isUncertain = document.getElementById("editDepartureUncertain").checked;
      const updatedData = {
        memberId: document.getElementById("editMemberId").value.trim().toUpperCase(),
        name: document.getElementById("editName").value.trim(),
        englishName: document.getElementById("editEnglishName").value.trim().toUpperCase(),
        passport: document.getElementById("editPassport").value.trim().toUpperCase(),
        nationalId: document.getElementById("editNationalId").value.trim().toUpperCase(),
        birthday: document.getElementById("editBirthday").value,
        gender: document.getElementById("editGender").value,
        lineNickname: document.getElementById("editLineNickname").value.trim(),
        airline: document.getElementById("editAirline").value.trim().toUpperCase(),
        arrival: document.getElementById("editArrival").value,
        departure: isUncertain ? "" : document.getElementById("editDeparture").value,
        isDepartureUncertain: isUncertain,
        stayDays: parseInt(document.getElementById("editStayDays").value, 10) || 1,
        staff: document.getElementById("editStaff").value.trim(),
        status: document.getElementById("editStatus").value,
        points: parseInt(document.getElementById("editPoints").value, 10) || 0,
        note: document.getElementById("editNote").value.trim()
      };

      update(ref(db, `guests/${editingGuestId}`), updatedData).then(() => {
        closeEditDrawer();
        alert("會員編號、資料、點數與備註已成功全面更新！");
      }).catch(err => {
        alert("儲存失敗: " + err.message);
      });
    };

    // 10. 房務操作與續訂
    window.deleteGuest = (id) => {
      if (confirm("確定要刪除這筆旅客資料嗎？（刪除後無法復原）")) {
        remove(ref(db, `guests/${id}`));
      }
    };

    window.closeStayCase = (id) => {
      if (confirm("確定將此旅客標記為【結案退房】？將從警戒看板移出，並正式列入歷史來訪與累計點數。")) {
        update(ref(db, `guests/${id}`), { housekeepingStatus: 'closed', status: 'completed' });
      }
    };

    window.copyLineCareText = (name, staff, departure, nightsRemaining) => {
      const depInfo = departure === '未定' ? '尚未確定' : departure.replace('T', ' ');
      const text = `您好 ${name}！我是您的濟州接待專員 ${staff}。提醒您預計退房時間為 (${depInfo})。請問行程是否順利？若需要協助加訂續住、預約送機或調整行程，請隨時於群組告知我們喔！`;
      navigator.clipboard.writeText(text).then(() => alert("已成功複製關懷話術至剪貼簿！"));
    };

    let currentExtendId = null;
    let currentStayDays = 1;

    window.openExtendModal = (id, days) => {
      currentExtendId = id;
      currentStayDays = days;
      document.getElementById("extendModal").classList.remove("hidden");
    };

    window.closeExtendModal = () => {
      document.getElementById("extendModal").classList.add("hidden");
    };

    window.confirmExtend = () => {
      const addNights = parseInt(document.getElementById("extendNightsSelect").value, 10);
      const guest = allGuests[currentExtendId];
      if (!guest) return;

      const oldDep = guest.departure ? new Date(guest.departure) : new Date();
      oldDep.setDate(oldDep.getDate() + addNights);
      
      const pad = (n) => String(n).padStart(2, '0');
      const newDepStr = `${oldDep.getFullYear()}-${pad(oldDep.getMonth() + 1)}-${pad(oldDep.getDate())}T${pad(oldDep.getHours())}:${pad(oldDep.getMinutes())}`;

      update(ref(db, `guests/${currentExtendId}`), {
        departure: newDepStr,
        isDepartureUncertain: false,
        stayDays: currentStayDays + addNights,
        roomExtendedCount: (guest.roomExtendedCount || 0) + 1,
        housekeepingStatus: 'extended'
      }).then(() => {
        closeExtendModal();
        alert(`已成功為旅客加訂續住 ${addNights} 晚！`);
      });
    };

    // 11. 分頁切換
    window.switchTab = (tab) => {
      activeTab = tab;
      if (tab === 'roster') {
        document.getElementById("rosterView").classList.remove("hidden");
        document.getElementById("housekeepingView").classList.add("hidden");
        document.getElementById("tabRosterBtn").className = "flex-1 sm:flex-initial px-4 py-2 text-xs font-bold text-white bg-red-600 rounded-xl shadow-md";
        document.getElementById("tabHousekeepingBtn").className = "flex-1 sm:flex-initial px-4 py-2 text-xs font-medium text-neutral-400 hover:text-white rounded-xl";
      } else {
        document.getElementById("rosterView").classList.add("hidden");
        document.getElementById("housekeepingView").classList.remove("hidden");
        document.getElementById("tabHousekeepingBtn").className = "flex-1 sm:flex-initial px-4 py-2 text-xs font-bold text-white bg-red-600 rounded-xl shadow-md";
        document.getElementById("tabRosterBtn").className = "flex-1 sm:flex-initial px-4 py-2 text-xs font-medium text-neutral-400 hover:text-white rounded-xl";
      }
    };

    document.getElementById("searchInput").addEventListener("input", renderDashboard);
  </script>
</head>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-neutral-400 mb-1">LINE 暱稱</label>
            <input id="editLineNickname" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500" />
          </div>
          <div>
            <label class="block text-neutral-400 mb-1">抵達航班代碼</label>
            <input id="editAirline" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white uppercase outline-none focus:border-red-500" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="block text-neutral-400 mb-1">預計抵達濟州時間</label>
            <input id="editArrival" type="datetime-local" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 text-xs" />
          </div>
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-neutral-400">預計離開濟州時間</label>
              <label class="flex items-center gap-1 cursor-pointer select-none text-[11px] text-red-400 font-medium">
                <input id="editDepartureUncertain" type="checkbox" class="w-3 h-3 rounded bg-neutral-950 border-neutral-800 text-red-600 focus:ring-0 cursor-pointer accent-red-600" />
                <span>尚未確定</span>
              </label>
            </div>
            <input id="editDeparture" type="datetime-local" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500 text-xs" />
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          <div>
            <label class="block text-neutral-400 mb-1">停留晚數</label>
            <input id="editStayDays" type="number" min="1" max="60" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500" />
          </div>
          <div>
            <label class="block text-amber-400 font-semibold mb-1">本次發放點數</label>
            <input id="editPoints" type="number" min="0" placeholder="0" class="w-full px-3 py-2 bg-neutral-950 border border-amber-900/60 rounded-xl text-amber-400 font-bold outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="block text-neutral-400 mb-1">接待專員</label>
            <input id="editStaff" placeholder="指派人員" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500" />
          </div>
          <div>
            <label class="block text-neutral-400 mb-1">處理狀態</label>
            <select id="editStatus" class="w-full px-2 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500">
              <option value="pending">待確認</option>
              <option value="confirmed">已確認</option>
              <option value="checked_in">已入住</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-amber-400 font-semibold mb-1">📌 房務 / 行程特殊備註</label>
          <textarea id="editNote" rows="3" placeholder="例如：房號 302、加嬰兒床、已收續住尾款等..." class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-amber-500 placeholder:text-neutral-600 leading-relaxed"></textarea>
        </div>
      </div>

      <div class="flex gap-2 pt-2 border-t border-neutral-800">
        <button onclick="closeEditDrawer()" class="flex-1 py-2.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 rounded-xl text-xs font-medium">取消</button>
        <button onclick="saveGuestDetails()" class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs shadow-md shadow-red-950">儲存變更</button>
      </div>
    </div>
  </div>

  <!-- 續住加訂彈窗 -->
  <div id="extendModal" class="hidden fixed inset-0 bg-neutral-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
      <h3 class="text-sm font-bold text-white">🏨 快速辦理續住加訂</h3>
      <p class="text-xs text-neutral-400">請選擇本次要延長的住宿晚數：</p>
      <div>
        <label class="block text-xs font-semibold text-neutral-300 mb-1">加訂住宿晚數</label>
        <select id="extendNightsSelect" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-700 rounded-xl text-xs text-white outline-none focus:border-red-500">
          <option value="1">續訂 +1 晚</option>
          <option value="2">續訂 +2 晚</option>
          <option value="3">續訂 +3 晚</option>
          <option value="4">續訂 +4 晚</option>
          <option value="5">續訂 +5 晚</option>
          <option value="7">續訂 +7 晚 (一週)</option>
        </select>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeExtendModal()" class="flex-1 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 rounded-xl text-xs">取消</button>
        <button onclick="confirmExtend()" class="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs shadow-md shadow-red-950">確認延長</button>
      </div>
    </div>
  </div>

</body>
</html>
