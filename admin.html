<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>濟州島貴賓管理系統 </title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap');
    body { 
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
    /* 自訂滾動條 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #404040; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const k1 = "AIzaSyChnQOp6dz";
    const k2 = "bohJRCPiOMnA65xVmmUyysV8";

    const firebaseConfig = {
      apiKey: k1 + k2,
      authDomain: "jeju-system.firebaseapp.com",
      databaseURL: "https://jeju-system-default-rtdb.firebaseio.com",
      projectId: "jeju-system",
      storageBucket: "jeju-system.firebasestorage.app",
      messagingSenderId: "918975222741",
      appId: "1:918975222741:web:e9434a6326f522904c635c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const GAS_URL = "https://script.google.com/macros/s/AKfycbxK3HWHBJQsTUhXUNh4bd1f48XWUUUxpHEDEotJZk_SttvwrMiTBHnnaQuPwMwX718m/exec";
    const LIFF_URL = "https://liff.line.me/2011368021-eRH4fnvP";

    let rawGuests = {};
    let rawUsers = {};
    let activeTab = "active";
    let searchTerm = "";
    let currentEditKey = null;

    // 監聽客人與專員資料
    onValue(ref(db, "guests"), (snapshot) => {
      rawGuests = snapshot.val() || {};
      renderStats();
      renderGuestList();
    });

    onValue(ref(db, "users"), (snapshot) => {
      rawUsers = snapshot.val() || {};
      renderStaffSelects();
    });

    function renderStats() {
      let total = 0;
      let active = 0;
      let pending = 0;
      let urgentExtension = 0;
      let followUpCount = 0;

      const nowTs = Date.now();
      const todayZero = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()).getTime();

      Object.values(rawGuests).forEach(g => {
        if (g.status === 'cancelled' || g.status === 'merged') return;
        total++;
        if (!g.staff || g.staff === "未指派" || g.status === "pending") pending++;
        if (g.status !== "completed" && g.status !== "checked_out") {
          active++;

          let depTs = 0;
          if (g.isDepartureUncertain || !g.departure) {
            if (g.arrival) {
              const arrD = new Date(g.arrival);
              const baseD = new Date(arrD.getFullYear(), arrD.getMonth(), arrD.getDate());
              if (arrD.getHours() < 5) baseD.setDate(baseD.getDate() - 1);
              depTs = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate() + 5, 12, 0, 0).getTime();
            }
          } else {
            depTs = new Date(g.departure).getTime();
          }

          if (depTs > 0) {
            const hLeft = (depTs - nowTs) / 3600000;
            if (hLeft <= 48 && hLeft >= -12) urgentExtension++;
          }
        }

        if (g.nextVisitDate) {
          const vTs = new Date(g.nextVisitDate + "T00:00:00").getTime();
          const dLeft = Math.round((vTs - todayZero) / 86400000);
          if (dLeft >= 0 && dLeft <= 14) followUpCount++;
        }
      });

      document.getElementById("statTotal").textContent = total;
      document.getElementById("statActive").textContent = active;
      document.getElementById("statPending").textContent = pending;
      document.getElementById("statUrgent").textContent = urgentExtension;
      document.getElementById("statFollowUp").textContent = followUpCount;
    }

    function renderStaffSelects() {
      const staffSelect = document.getElementById("editStaff");
      const taskStaffSelect = document.getElementById("taskStaff");
      const filterSelect = document.getElementById("staffFilter");
      const currentFilter = filterSelect.value;
      
      const staffList = Object.values(rawUsers).map(u => u.name).filter(Boolean);
      const uniqueStaff = Array.from(new Set(staffList));

      staffSelect.innerHTML = '<option value="">未指派專員</option>' + uniqueStaff.map(s => `<option value="${s}">${s}</option>`).join('');
      taskStaffSelect.innerHTML = '<option value="">請選擇專員</option>' + uniqueStaff.map(s => `<option value="${s}">${s}</option>`).join('');
      filterSelect.innerHTML = '<option value="ALL">全部專員</option><option value="UNASSIGNED">未指派</option>' + uniqueStaff.map(s => `<option value="${s}">${s}</option>`).join('');
      filterSelect.value = currentFilter || "ALL";
    }

    function renderGuestList() {
      const listContainer = document.getElementById("guestList");
      listContainer.innerHTML = "";

      const filterStaff = document.getElementById("staffFilter").value;
      const nowTs = Date.now();
      const todayZero = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()).getTime();

      let entries = Object.entries(rawGuests).filter(([key, g]) => {
        if (g.status === 'cancelled' || g.status === 'merged') return false;

        if (activeTab === "active" && (g.status === "completed" || g.status === "checked_out")) return false;
        if (activeTab === "completed" && (g.status !== "completed" && g.status !== "checked_out")) return false;
        if (activeTab === "followup") {
          if (!g.nextVisitDate) return false;
          const vTs = new Date(g.nextVisitDate + "T00:00:00").getTime();
          const dLeft = Math.round((vTs - todayZero) / 86400000);
          if (dLeft < 0 || dLeft > 14) return false;
        }

        if (filterStaff === "UNASSIGNED" && g.staff && g.staff.trim() !== "" && g.staff !== "未指派") return false;
        if (filterStaff !== "ALL" && filterStaff !== "UNASSIGNED" && g.staff !== filterStaff) return false;

        if (searchTerm) {
          const term = searchTerm.toLowerCase();
          const matchName = (g.name || "").toLowerCase().includes(term);
          const matchPhone = (g.phone || "").toLowerCase().includes(term);
          const matchStaff = (g.staff || "").toLowerCase().includes(term);
          const matchRoom = (g.roomNo || "").toLowerCase().includes(term);
          if (!matchName && !matchPhone && !matchStaff && !matchRoom) return false;
        }
        return true;
      });

      entries.sort((a, b) => {
        const tA = a[1].arrival ? new Date(a[1].arrival).getTime() : 0;
        const tB = b[1].arrival ? new Date(b[1].arrival).getTime() : 0;
        return tA - tB;
      });

      if (entries.length === 0) {
        listContainer.innerHTML = `
          <div class="col-span-full py-16 text-center text-neutral-500 bg-neutral-900/40 rounded-2xl border border-neutral-800/80">
            <p class="text-sm font-medium">查無符合條件之貴賓行程資料</p>
          </div>
        `;
        return;
      }

      entries.forEach(([key, g]) => {
        const card = document.createElement("div");
        card.className = "bg-neutral-900 border border-neutral-800 hover:border-neutral-700 transition rounded-2xl p-4 sm:p-5 flex flex-col justify-between shadow-xl relative overflow-hidden";

        // 房務警戒推播標籤
        let extensionNotice = "";
        let depTs = 0;
        if (g.isDepartureUncertain || !g.departure) {
          if (g.arrival) {
            const arrD = new Date(g.arrival);
            const baseD = new Date(arrD.getFullYear(), arrD.getMonth(), arrD.getDate());
            if (arrD.getHours() < 5) baseD.setDate(baseD.getDate() - 1);
            depTs = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate() + 5, 12, 0, 0).getTime();
          }
        } else {
          depTs = new Date(g.departure).getTime();
        }

        if (depTs > 0 && g.status !== "completed" && g.status !== "checked_out") {
          const hLeft = (depTs - nowTs) / 3600000;
          if (hLeft <= 48 && hLeft >= -12) {
            const daysRemaining = Math.max(1, Math.ceil(hLeft / 24));
            extensionNotice = `
              <div class="bg-rose-950/60 border border-rose-900/80 text-rose-300 p-2.5 rounded-xl text-xs flex items-center justify-between font-medium animate-pulse">
                <span>⚠️ 房務續訂警戒</span>
                <span class="font-mono font-bold whitespace-nowrap">剩餘 ${daysRemaining} 晚 (請確認續住/返程)</span>
              </div>
            `;
          }
        }

        // 下次回訪時間標籤 (新增)
        let followUpBadge = "";
        if (g.nextVisitDate) {
          const vTs = new Date(g.nextVisitDate + "T00:00:00").getTime();
          const dLeft = Math.round((vTs - todayZero) / 86400000);
          const isUrgent = dLeft <= 14 && dLeft >= 0;
          followUpBadge = `
            <div class="mt-2 text-xs flex items-center justify-between px-3 py-2 rounded-xl ${isUrgent ? 'bg-amber-950/60 border border-amber-800 text-amber-300' : 'bg-neutral-950 border border-neutral-800 text-neutral-400'}">
              <span class="font-bold flex items-center gap-1.5 whitespace-nowrap">🗓 預計回訪：${g.nextVisitDate}</span>
              <span class="font-mono font-bold whitespace-nowrap ${isUrgent ? 'text-rose-400 font-black animate-pulse' : ''}">${dLeft >= 0 ? `(倒數 ${dLeft} 天)` : '(已逾期)'}</span>
            </div>
          `;
        }

        const isBound = !!g.lineUserId;

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-start justify-between gap-2 border-b border-neutral-800 pb-3">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h3 class="text-base sm:text-lg font-black text-white tracking-tight whitespace-nowrap">${g.name || "未填寫"}</h3>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap ${g.clientType === 'VIP' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-neutral-800 text-neutral-300'}">${g.clientType || "新客"}</span>
                  ${g.gender ? `<span class="text-[10px] font-medium text-neutral-400 font-mono whitespace-nowrap">(${g.gender})</span>` : ''}
                </div>
                <div class="text-xs text-neutral-400 font-mono mt-0.5 flex items-center gap-2 flex-wrap">
                  <span class="whitespace-nowrap">${g.phone || "無電話"}</span>
                  ${g.lineNickname ? `<span class="text-neutral-500 whitespace-nowrap">| 群暱稱: ${g.lineNickname}</span>` : ''}
                </div>
              </div>
              <div class="text-right whitespace-nowrap">
                <span class="inline-block text-xs px-2.5 py-1 rounded-lg font-bold whitespace-nowrap ${g.staff ? 'bg-red-950/60 border border-red-800/80 text-red-300' : 'bg-neutral-800 border border-neutral-700 text-neutral-400'}">
                  ${g.staff ? `專員: ${g.staff}` : '未指派專員'}
                </span>
              </div>
            </div>

            <!-- 行程核心資訊 -->
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="bg-neutral-950 p-2.5 rounded-xl border border-neutral-800/80">
                <span class="text-neutral-500 block text-[11px] whitespace-nowrap">抵達濟州</span>
                <span class="text-emerald-400 font-bold font-mono block mt-0.5 whitespace-nowrap">${g.arrival ? g.arrival.replace('T', ' ') : '未定'}</span>
                <span class="text-[10px] text-neutral-400 block whitespace-nowrap">${g.airline || '無航班號'}</span>
              </div>
              <div class="bg-neutral-950 p-2.5 rounded-xl border border-neutral-800/80">
                <span class="text-neutral-500 block text-[11px] whitespace-nowrap">預計離開 (停留 ${g.stayDays || 5} 晚)</span>
                <span class="text-neutral-300 font-mono block mt-0.5 whitespace-nowrap">${g.isDepartureUncertain ? '尚未確定' : (g.departure ? g.departure.replace('T', ' ') : '未定')}</span>
                <span class="text-[10px] text-neutral-400 block whitespace-nowrap">${g.returnAirline || '無航班號'}</span>
              </div>
            </div>

            <!-- 飯店與房號 -->
            <div class="flex items-center justify-between text-xs px-1 flex-wrap gap-1">
              <span class="text-neutral-400 whitespace-nowrap">飯店/房號：<b class="text-neutral-200">${g.hotel || '濟州君悅'}</b> ${g.roomNo ? `<span class="text-amber-300 font-mono font-bold">(${g.roomNo} 房)</span>` : '<span class="text-neutral-600">(未排房)</span>'}</span>
              <span class="text-[11px] whitespace-nowrap ${isBound ? 'text-emerald-400 font-medium' : 'text-neutral-500'}">
                ${isBound ? '🟢 已綁定 LINE' : '⚪ 未綁定 LINE'}
              </span>
            </div>

            <!-- 房務警戒推播標籤 -->
            ${extensionNotice}

            <!-- 備註與下次回訪標籤 -->
            ${g.note ? `<div class="bg-neutral-950/60 p-2.5 rounded-lg border border-neutral-800/60 text-xs text-neutral-300 break-words"><span class="text-neutral-500 font-semibold">備註：</span>${g.note}</div>` : ''}
            ${followUpBadge}
          </div>

          <!-- 操作按鈕列 -->
          <div class="pt-4 mt-3 border-t border-neutral-800/80 flex items-center justify-between gap-2">
            <button onclick="openEditModal('${key}')" class="flex-1 py-2 bg-neutral-800 hover:bg-neutral-700 active:scale-95 text-neutral-200 text-xs font-bold rounded-xl transition border border-neutral-700 text-center whitespace-nowrap">
              編輯 / 指派
            </button>
            <button onclick="copyClaimLink('${key}')" class="flex-1 py-2 bg-red-950/40 hover:bg-red-900/60 text-red-300 text-xs font-bold rounded-xl transition border border-red-900/40 text-center whitespace-nowrap">
              📋 複製確認連結
            </button>
          </div>
        `;
        listContainer.appendChild(card);
      });

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    window.switchTab = (tab) => {
      activeTab = tab;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.remove("text-red-400", "border-red-500", "bg-red-950/30");
        btn.classList.add("text-neutral-400", "border-transparent");
      });
      document.getElementById(`tab-${tab}`).classList.add("text-red-400", "border-red-500", "bg-red-950/30");
      renderGuestList();
    };

    window.handleSearch = (val) => {
      searchTerm = val.trim();
      renderGuestList();
    };

    window.handleFilterChange = () => {
      renderGuestList();
    };

    window.toggleSidebar = () => {
      const sidebar = document.getElementById("mobileSidebar");
      sidebar.classList.toggle("hidden");
    };

    window.copyClaimLink = (key) => {
      const link = `${LIFF_URL}?guestId=${key}`;
      navigator.clipboard.writeText(link).then(() => {
        alert("已複製專屬行程確認卡連結！\n可以直接傳給客戶在 LINE 打開並確認行程。");
      }).catch(err => {
        prompt("請手動複製連結：", link);
      });
    };

    window.openEditModal = (key) => {
      currentEditKey = key;
      const g = rawGuests[key];
      if (!g) return;

      document.getElementById("editName").value = g.name || "";
      document.getElementById("editPhone").value = g.phone || "";
      document.getElementById("editStaff").value = g.staff || "";
      document.getElementById("editHotel").value = g.hotel || "濟州君悅";
      document.getElementById("editRoomNo").value = g.roomNo || "";
      document.getElementById("editStatus").value = g.status || "confirmed";
      document.getElementById("editClientType").value = g.clientType || "新客";
      document.getElementById("editNextVisitDate").value = g.nextVisitDate || ""; // 回訪時間讀取
      document.getElementById("editNote").value = g.note || "";

      document.getElementById("editModal").classList.remove("hidden");
    };

    window.closeEditModal = () => {
      currentEditKey = null;
      document.getElementById("editModal").classList.add("hidden");
    };

    window.saveGuestEdit = async () => {
      if (!currentEditKey) return;
      const oldStaff = rawGuests[currentEditKey]?.staff || "";
      const newStaff = document.getElementById("editStaff").value.trim();
      const hotelVal = document.getElementById("editHotel").value.trim();
      const roomNoVal = document.getElementById("editRoomNo").value.trim();
      const nextVisitDateVal = document.getElementById("editNextVisitDate").value;

      const updates = {
        name: document.getElementById("editName").value.trim(),
        phone: document.getElementById("editPhone").value.trim(),
        staff: newStaff,
        hotel: hotelVal,
        roomNo: roomNoVal,
        status: document.getElementById("editStatus").value,
        clientType: document.getElementById("editClientType").value,
        nextVisitDate: nextVisitDateVal, // 回訪時間儲存
        note: document.getElementById("editNote").value.trim(),
        updatedAt: Date.now()
      };

      try {
        await update(ref(db, `guests/${currentEditKey}`), updates);

        if (newStaff && newStaff !== oldStaff) {
          const g = rawGuests[currentEditKey];
          fetch(GAS_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "assign_staff",
              staffName: newStaff,
              name: updates.name,
              phone: updates.phone,
              hotel: hotelVal,
              roomNo: roomNoVal,
              arrival: g.arrival || "-",
              stayDays: g.stayDays || 5,
              note: updates.note || "無"
            })
          }).catch(err => console.error("指派通知推播失敗:", err));
        }

        closeEditModal();
      } catch (err) {
        alert("儲存失敗：" + err.message);
      }
    };

    window.deleteGuest = async () => {
      if (!currentEditKey) return;
      if (confirm("確定要刪除這筆客戶行程資料嗎？（無法復原）")) {
        try {
          await remove(ref(db, `guests/${currentEditKey}`));
          closeEditModal();
        } catch (err) {
          alert("刪除失敗：" + err.message);
        }
      }
    };

    // 臨時派遣任務指派
    window.openTaskModal = () => {
      document.getElementById("taskModal").classList.remove("hidden");
    };

    window.closeTaskModal = () => {
      document.getElementById("taskModal").classList.add("hidden");
    };

    window.sendExtraTask = async () => {
      const staffName = document.getElementById("taskStaff").value;
      const taskContent = document.getElementById("taskContent").value.trim();
      const deadline = document.getElementById("taskDeadline").value.replace("T", " ");
      const desc = document.getElementById("taskDesc").value.trim();

      if (!staffName || !taskContent) {
        alert("請選擇專員並填寫任務標題！");
        return;
      }

      const btn = document.getElementById("taskSubmitBtn");
      btn.innerText = "發送中...";
      btn.disabled = true;

      try {
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "extra_task",
            staffName: staffName,
            taskContent: taskContent,
            deadline: deadline || "無設定",
            desc: desc || "無"
          })
        });

        alert("臨時派遣任務已成功指派並推播至群組！");
        document.getElementById("taskForm").reset();
        closeTaskModal();
      } catch (err) {
        alert("任務指派失敗：" + err.message);
      } finally {
        btn.innerText = "確認指派任務";
        btn.disabled = false;
      }
    };

    // 匯出 Google Sheets
    window.exportToSpreadsheet = async () => {
      const btn = document.getElementById("exportBtn");
      btn.innerText = "匯出中...";
      btn.disabled = true;

      try {
        const rows = Object.values(rawGuests).map(g => ({
          "姓名": g.name || "",
          "電話": g.phone || "",
          "專員": g.staff || "未指派",
          "等級": g.clientType || "新客",
          "飯店": g.hotel || "",
          "房號": g.roomNo || "",
          "抵達時間": g.arrival || "",
          "抵達航班": g.airline || "",
          "離開時間": g.departure || "",
          "回程航班": g.returnAirline || "",
          "停留晚數": g.stayDays || 5,
          "下次回訪": g.nextVisitDate || "",
          "狀態": g.status || "",
          "備註": g.note || ""
        }));

        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "export_to_sheet",
            rows: rows
          })
        });
        const result = await res.json();
        if (result.sheetUrl) {
          window.open(result.sheetUrl, "_blank");
        } else {
          alert("匯出完成！");
        }
      } catch (err) {
        alert("匯出失敗：" + err.message);
      } finally {
        btn.innerText = "📊 匯出 Sheet";
        btn.disabled = false;
      }
    };

    window.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</head>

<body class="bg-[#0c0d0e] text-neutral-100 min-h-screen selection:bg-red-600 selection:text-white pb-16">
  <!-- 頂部導航列 (包含漢堡選單與完整操作按鈕) -->
  <header class="bg-[#121316]/90 backdrop-blur-md border-b border-neutral-800/80 sticky top-0 z-30 px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
      <!-- 漢堡選單按鈕 (手機版/快捷切換) -->
      <button onclick="toggleSidebar()" class="p-1.5 rounded-lg bg-neutral-800/60 hover:bg-neutral-800 text-neutral-300 border border-neutral-700/60 transition focus:outline-none">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="flex items-center gap-2.5">
        <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
        <h1 class="text-base sm:text-lg font-black text-white tracking-tight whitespace-nowrap">濟州貴賓禮賓管理系統</h1>
      </div>
    </div>

    <!-- 頂部快捷操作按鈕組 -->
    <div class="flex items-center gap-2 sm:gap-3">
      <button onclick="openTaskModal()" class="text-xs bg-red-950/60 hover:bg-red-900/80 text-red-300 px-3 py-1.5 rounded-lg border border-red-800/80 transition font-semibold flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="send" class="w-3.5 h-3.5"></i>
        <span>+ 臨時派遣</span>
      </button>
      <button id="exportBtn" onclick="exportToSpreadsheet()" class="text-xs bg-neutral-800 hover:bg-neutral-700 text-neutral-200 px-3 py-1.5 rounded-lg border border-neutral-700 transition font-semibold flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5 text-emerald-400"></i>
        <span>📊 匯出 Sheet</span>
      </button>
      <a href="index.html" target="_blank" class="text-xs bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg transition font-semibold shadow-md shadow-red-950 flex items-center gap-1 whitespace-nowrap">
        <span>+ 預約表單</span>
      </a>
    </div>
  </header>

  <!-- 漢堡選單彈出式抽屜 (Mobile / Drawer) -->
  <div id="mobileSidebar" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-start">
    <div class="bg-[#121316] w-64 h-full border-r border-neutral-800 p-5 space-y-6 flex flex-col justify-between shadow-2xl">
      <div class="space-y-4">
        <div class="flex items-center justify-between border-b border-neutral-800 pb-3">
          <span class="text-xs font-black text-neutral-400 uppercase tracking-wider">功能選單</span>
          <button onclick="toggleSidebar()" class="p-1 rounded text-neutral-400 hover:text-white">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <nav class="space-y-1 text-xs font-semibold">
          <button onclick="switchTab('active'); toggleSidebar();" class="w-full text-left px-3 py-2.5 rounded-xl text-neutral-300 hover:bg-neutral-800/80 transition flex items-center gap-2.5">
            <i data-lucide="users" class="w-4 h-4 text-emerald-400"></i>
            <span>進行中貴賓名冊</span>
          </button>
          <button onclick="switchTab('followup'); toggleSidebar();" class="w-full text-left px-3 py-2.5 rounded-xl text-neutral-300 hover:bg-neutral-800/80 transition flex items-center gap-2.5">
            <i data-lucide="calendar-clock" class="w-4 h-4 text-amber-400"></i>
            <span>回訪追蹤 (14天內)</span>
          </button>
          <button onclick="switchTab('completed'); toggleSidebar();" class="w-full text-left px-3 py-2.5 rounded-xl text-neutral-300 hover:bg-neutral-800/80 transition flex items-center gap-2.5">
            <i data-lucide="check-circle" class="w-4 h-4 text-neutral-400"></i>
            <span>已結案 / 已退房名冊</span>
          </button>
        </nav>
      </div>
      <div class="pt-4 border-t border-neutral-800 text-[11px] text-neutral-500 text-center font-mono">
        濟州島禮賓管理後台 v2.4
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 sm:px-8 pt-6 space-y-6">
    <!-- 數據概覽看板 -->
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 sm:gap-4">
      <div class="bg-[#141518] border border-neutral-800/80 rounded-2xl p-4 shadow-lg">
        <span class="text-xs font-semibold text-neutral-400 block whitespace-nowrap">總登記預約</span>
        <span id="statTotal" class="text-2xl sm:text-3xl font-black text-white font-mono mt-1 block">-</span>
      </div>
      <div class="bg-[#141518] border border-neutral-800/80 rounded-2xl p-4 shadow-lg">
        <span class="text-xs font-semibold text-emerald-400 block whitespace-nowrap">進行中 / 在島行程</span>
        <span id="statActive" class="text-2xl sm:text-3xl font-black text-emerald-400 font-mono mt-1 block">-</span>
      </div>
      <div class="bg-[#141518] border border-neutral-800/80 rounded-2xl p-4 shadow-lg">
        <span class="text-xs font-semibold text-rose-400 block whitespace-nowrap">待指派專員</span>
        <span id="statPending" class="text-2xl sm:text-3xl font-black text-rose-400 font-mono mt-1 block">-</span>
      </div>
      <div class="bg-[#141518] border border-neutral-800/80 rounded-2xl p-4 shadow-lg">
        <span class="text-xs font-semibold text-amber-400 block whitespace-nowrap">房務續訂警戒</span>
        <span id="statUrgent" class="text-2xl sm:text-3xl font-black text-amber-400 font-mono mt-1 block">-</span>
      </div>
      <div class="bg-[#141518] border border-neutral-800/80 rounded-2xl p-4 shadow-lg">
        <span class="text-xs font-semibold text-indigo-400 block whitespace-nowrap">14天次回訪提醒</span>
        <span id="statFollowUp" class="text-2xl sm:text-3xl font-black text-indigo-400 font-mono mt-1 block">-</span>
      </div>
    </div>

    <!-- 篩選與搜尋列 -->
    <div class="bg-[#141518] border border-neutral-800/80 rounded-2xl p-4 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 shadow-lg">
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0 border-b sm:border-b-0 border-neutral-800/60">
        <button id="tab-active" onclick="switchTab('active')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold transition border border-red-500 bg-red-950/30 text-red-400 whitespace-nowrap">
          進行中貴賓
        </button>
        <button id="tab-followup" onclick="switchTab('followup')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold transition border border-transparent text-neutral-400 hover:text-white whitespace-nowrap">
          回訪追蹤 (14天內)
        </button>
        <button id="tab-completed" onclick="switchTab('completed')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold transition border border-transparent text-neutral-400 hover:text-white whitespace-nowrap">
          已結案 / 已退房
        </button>
      </div>

      <div class="flex items-center gap-2">
        <select id="staffFilter" onchange="handleFilterChange()" class="bg-neutral-950 border border-neutral-800 text-xs text-neutral-300 px-3 py-2 rounded-xl outline-none focus:border-red-500 whitespace-nowrap">
          <option value="ALL">全部專員</option>
        </select>
        <input oninput="handleSearch(this.value)" placeholder="搜尋姓名 / 電話 / 房號..." class="bg-neutral-950 border border-neutral-800 text-xs text-neutral-100 placeholder:text-neutral-600 px-3.5 py-2 rounded-xl outline-none focus:border-red-500 w-full sm:w-56" />
      </div>
    </div>

    <!-- 名冊卡片列表區 -->
    <div id="guestList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <!-- 編輯 / 指派專員 彈出視窗 -->
  <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
    <div class="bg-[#141518] border border-neutral-800 w-full max-w-lg rounded-2xl shadow-2xl p-5 sm:p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-neutral-800 pb-3">
        <h3 class="text-base font-black text-white whitespace-nowrap">編輯貴賓行程資料</h3>
        <button onclick="closeEditModal()" class="text-neutral-400 hover:text-white text-sm font-bold">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">客戶姓名</label>
            <input id="editName" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500" />
          </div>
          <div>
            <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">聯絡電話</label>
            <input id="editPhone" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white font-mono outline-none focus:border-red-500" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">指派專員</label>
            <select id="editStaff" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500"></select>
          </div>
          <div>
            <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">客戶等級</label>
            <select id="editClientType" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500">
              <option value="新客">新客</option>
              <option value="常客">常客</option>
              <option value="VIP">VIP 貴賓</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">入住飯店</label>
            <input id="editHotel" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500" />
          </div>
          <div>
            <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">房號</label>
            <input id="editRoomNo" placeholder="例：1208" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white font-mono outline-none focus:border-red-500" />
          </div>
        </div>

        <!-- 預計下次回訪時間 (新增) -->
        <div class="bg-amber-950/20 border border-amber-900/40 rounded-xl p-3 space-y-1">
          <label class="block text-amber-300 font-bold whitespace-nowrap">🗓 預計下次回訪時間 (14天前自動推播提醒)</label>
          <input id="editNextVisitDate" type="date" class="w-full px-3 py-2 bg-neutral-950 border border-amber-800/60 rounded-xl text-white outline-none focus:border-amber-500 text-xs" />
          <p class="text-[10px] text-neutral-400">設定後，系統將於該日期的 14 天前夜間排程自動發送推播給專員。</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">行程狀態</label>
            <select id="editStatus" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500">
              <option value="pending">待處理</option>
              <option value="confirmed">已確認 / 接待中</option>
              <option value="completed">已結案</option>
              <option value="checked_out">已退房</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">需求與備註</label>
          <textarea id="editNote" rows="2" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500"></textarea>
        </div>
      </div>

      <div class="pt-3 border-t border-neutral-800 flex items-center justify-between gap-2">
        <button onclick="deleteGuest()" class="text-rose-400 hover:bg-rose-950/40 px-3 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap">
          刪除行程
        </button>
        <div class="flex items-center gap-2">
          <button onclick="closeEditModal()" class="px-4 py-2 bg-neutral-800 text-neutral-300 rounded-xl text-xs font-bold hover:bg-neutral-700 transition whitespace-nowrap">
            取消
          </button>
          <button onclick="saveGuestEdit()" class="px-5 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-red-950 whitespace-nowrap">
            儲存變更
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 臨時派遣任務指派 彈出視窗 -->
  <div id="taskModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
    <div class="bg-[#141518] border border-neutral-800 w-full max-w-md rounded-2xl shadow-2xl p-5 sm:p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-neutral-800 pb-3">
        <h3 class="text-base font-black text-white whitespace-nowrap">指派臨時任務</h3>
        <button onclick="closeTaskModal()" class="text-neutral-400 hover:text-white text-sm font-bold">✕</button>
      </div>

      <form id="taskForm" onsubmit="event.preventDefault(); sendExtraTask();" class="space-y-3 text-xs">
        <div>
          <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">負責專員 *</label>
          <select id="taskStaff" required class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500"></select>
        </div>
        <div>
          <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">任務標題 *</label>
          <input id="taskContent" required placeholder="例如：機場接機加派專車、協助送件" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500" />
        </div>
        <div>
          <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">截止時間</label>
          <input id="taskDeadline" type="datetime-local" class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500" />
        </div>
        <div>
          <label class="block text-neutral-400 mb-1 font-semibold whitespace-nowrap">任務說明</label>
          <textarea id="taskDesc" rows="3" placeholder="請填寫具體任務內容與注意事項..." class="w-full px-3 py-2 bg-neutral-950 border border-neutral-800 rounded-xl text-white outline-none focus:border-red-500"></textarea>
        </div>
        <div class="pt-3 border-t border-neutral-800 flex items-center justify-end gap-2">
          <button type="button" onclick="closeTaskModal()" class="px-4 py-2 bg-neutral-800 text-neutral-300 rounded-xl text-xs font-bold hover:bg-neutral-700 transition whitespace-nowrap">
            取消
          </button>
          <button id="taskSubmitBtn" type="submit" class="px-5 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-red-950 whitespace-nowrap">
            確認指派任務
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
